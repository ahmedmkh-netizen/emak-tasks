<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMAK Hub - إدارة المهام</title>
<link rel="icon" href="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, update, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBagaYYgtQgAGyntE1go9IsGy7T85cvuSY",
  authDomain: "emak-tasks.firebaseapp.com",
  databaseURL: "https://emak-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emak-tasks",
  storageBucket: "emak-tasks.firebasestorage.app",
  messagingSenderId: "752119205815",
  appId: "1:752119205815:web:a96725f43555fb0c742232"
};

const ADMIN_EMAILS = ["ahmedmkh@gmail.com"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let isAdmin = false;
let allTasks = {};
let currentFilter = "all";
let currentSearch = "";
let currentSort = "priority";
let currentTheme = localStorage.getItem("theme") || "dark";
let openTaskId = null;

// ==== الثيم ====
function applyTheme() {
  document.documentElement.setAttribute("data-theme", currentTheme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = currentTheme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", currentTheme);
}

// ==== أدوات ====
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}
function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" });
}
function formatDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function daysRemaining(dueDate) {
  if (!dueDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate); due.setHours(0,0,0,0);
  return Math.round((due - today) / (1000 * 60 * 60 * 24));
}
function dueLabel(dueDate) {
  const d = daysRemaining(dueDate);
  if (d === null) return "";
  if (d < 0) return `⚠️ متأخر ${Math.abs(d)} يوم`;
  if (d === 0) return `🔥 يستحق اليوم`;
  if (d === 1) return `📅 غداً`;
  if (d <= 3) return `📅 باقي ${d} أيام`;
  return `📅 ${dueDate}`;
}

// ==== تسجيل الدخول ====
document.getElementById("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) { alert("فشل تسجيل الدخول: " + e.message); }
};
document.getElementById("logoutBtn").onclick = () => {
  if (confirm("متأكد إنك عايز تخرج؟")) signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  const loginScreen = document.getElementById("loginScreen");
  const mainScreen = document.getElementById("mainScreen");
  if (user) {
    currentUser = user;
    isAdmin = ADMIN_EMAILS.includes(user.email);
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    document.getElementById("userName").textContent = user.displayName || user.email;
    document.getElementById("userRole").textContent = isAdmin ? "👑 مدير" : "👤 موظف";
    document.getElementById("userRole").className = isAdmin ? "role admin" : "role user";
    document.getElementById("addTaskCard").style.display = isAdmin ? "block" : "none";
    set(ref(db, "users/" + user.uid), {
      name: user.displayName || "",
      email: user.email || "",
      lastLogin: serverTimestamp(),
      isAdmin: isAdmin
    });
    loadTasks();
  } else {
    currentUser = null;
    isAdmin = false;
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
  }
});

// ==== تحميل ====
function loadTasks() {
  onValue(ref(db, "tasks"), (snap) => {
    allTasks = snap.val() || {};
    renderAll();
    // تحديث المودال لو مفتوح
    if (openTaskId && allTasks[openTaskId]) {
      renderModal(openTaskId);
    }
  });
}

// ==== إضافة مهمة ====
document.getElementById("addTaskForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!isAdmin) return alert("غير مصرح");
  const title = document.getElementById("taskTitle").value.trim();
  const assignee = document.getElementById("taskAssignee").value;
  const priority = document.getElementById("taskPriority").value;
  const dueDate = document.getElementById("taskDue").value;
  const notes = document.getElementById("taskNotes").value.trim();
  if (!title || !assignee) return;

  await push(ref(db, "tasks"), {
    title, assignee, priority, dueDate, notes,
    status: "جديدة",
    createdBy: currentUser.email,
    createdByName: currentUser.displayName || currentUser.email.split("@")[0],
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
  e.target.reset();
  showToast("✅ تمت إضافة المهمة");
};

// ==== تغيير الحالة ====
async function changeStatus(taskId, newStatus) {
  const t = allTasks[taskId];
  if (!t) return;
  await update(ref(db, "tasks/" + taskId), {
    status: newStatus,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast(`🔄 الحالة: ${newStatus}`);
}

// ==== إضافة ملاحظة ====
async function addComment(taskId, fromModal = false) {
  const inputId = fromModal ? "modal-comment-input" : "comment-" + taskId;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if (!text) return;

  const commentRef = push(ref(db, "tasks/" + taskId + "/comments"));
  await set(commentRef, {
    text,
    author: currentUser.displayName || currentUser.email.split("@")[0],
    authorEmail: currentUser.email,
    createdAt: serverTimestamp()
  });
  await update(ref(db, "tasks/" + taskId), {
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  input.value = "";
  showToast("💬 تمت إضافة الملاحظة");
}

// ==== حذف ====
async function deleteTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  if (confirm("متأكد من حذف المهمة؟ لا يمكن التراجع!")) {
    await remove(ref(db, "tasks/" + taskId));
    closeModal();
    showToast("🗑️ تم الحذف");
  }
}

// ==== تعديل ====
async function editTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  const t = allTasks[taskId];
  if (!t) return;
  const newTitle = prompt("العنوان الجديد:", t.title);
  if (newTitle === null) return;
  const newDue = prompt("تاريخ التسليم (YYYY-MM-DD):", t.dueDate || "");
  if (newDue === null) return;
  const newPriority = prompt("الأولوية (عاجل / مهم / عادي):", t.priority || "عادي");
  if (newPriority === null) return;
  const newAssignee = prompt("المسؤول (بهاء / محمود):", t.assignee);
  if (newAssignee === null) return;

  await update(ref(db, "tasks/" + taskId), {
    title: newTitle.trim() || t.title,
    dueDate: newDue.trim(),
    priority: newPriority.trim() || "عادي",
    assignee: newAssignee.trim() || t.assignee,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast("✏️ تم التعديل");
}

// ==== المودال ====
function openModal(taskId) {
  openTaskId = taskId;
  renderModal(taskId);
  document.getElementById("modalOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  openTaskId = null;
  document.getElementById("modalOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

function renderModal(taskId) {
  const t = allTasks[taskId];
  if (!t) return closeModal();

  const statusClass = t.status === "مكتملة" ? "done"
    : t.status === "جاري التنفيذ" ? "progress" : "new";
  const priorityClass = t.priority === "عاجل" ? "urgent"
    : t.priority === "مهم" ? "important" : "normal";
  const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
  const d = daysRemaining(t.dueDate);
  const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";

  const comments = t.comments ? Object.entries(t.comments).sort((a,b) =>
    (a[1].createdAt || 0) - (b[1].createdAt || 0)
  ) : [];

  const commentsHtml = comments.length > 0 ? comments.map(([cid, c]) => `
    <div class="modal-comment">
      <div class="modal-comment-head">
        <span class="modal-comment-author">${escapeHtml(c.author)}</span>
        <span class="modal-comment-date">${formatDateTime(c.createdAt)}</span>
      </div>
      <div class="modal-comment-text">${escapeHtml(c.text)}</div>
    </div>
  `).join("") : '<p class="empty-comments">لا توجد ملاحظات بعد</p>';

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-header ${priorityClass}">
      <div class="modal-badges">
        <span class="priority-badge ${priorityClass}">${
          t.priority === "عاجل" ? "🔴 عاجل" :
          t.priority === "مهم" ? "🟡 مهم" : "🟢 عادي"
        }</span>
        <span class="status-badge ${statusClass}">${t.status}</span>
      </div>
      <button class="modal-close" onclick="window.closeModal()">✕</button>
    </div>

    <h2 class="modal-title">${escapeHtml(t.title)}</h2>

    <div class="modal-meta">
      <div class="meta-item">
        <span class="meta-label">👤 المسؤول</span>
        <span class="meta-value">${escapeHtml(t.assignee)}</span>
      </div>
      ${t.dueDate ? `
      <div class="meta-item">
        <span class="meta-label">📅 التسليم</span>
        <span class="meta-value ${isOverdue ? 'overdue-text' : ''}">${dueLabel(t.dueDate)}</span>
      </div>` : ""}
      <div class="meta-item">
        <span class="meta-label">✏️ آخر تعديل</span>
        <span class="meta-value">${t.updatedByName ? escapeHtml(t.updatedByName) + " — " + formatDate(t.updatedAt) : "—"}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">🆕 أُنشئت</span>
        <span class="meta-value">${t.createdByName ? escapeHtml(t.createdByName) + " — " + formatDate(t.createdAt) : formatDate(t.createdAt)}</span>
      </div>
    </div>

    ${t.notes ? `
      <div class="modal-section">
        <div class="modal-section-title">📝 ملاحظات المهمة</div>
        <div class="modal-notes">${escapeHtml(t.notes)}</div>
      </div>` : ""}

    <div class="modal-section">
      <div class="modal-section-title">💬 التعليقات (${comments.length})</div>
      <div class="modal-comments-list">${commentsHtml}</div>
      <div class="modal-comment-form">
        <input id="modal-comment-input" type="text" placeholder="أضف تعليقاً...">
        <button onclick="window.addComment('${taskId}', true)">إرسال</button>
      </div>
    </div>

    <div class="modal-actions">
      <select onchange="window.changeStatus('${taskId}', this.value)" class="modal-status-select">
        <option ${t.status === "جديدة" ? "selected" : ""}>جديدة</option>
        <option ${t.status === "جاري التنفيذ" ? "selected" : ""}>جاري التنفيذ</option>
        <option ${t.status === "مكتملة" ? "selected" : ""}>مكتملة</option>
      </select>
      ${isAdmin ? `
        <button class="btn-edit" onclick="window.editTask('${taskId}')">✏️ تعديل</button>
        <button class="btn-del" onclick="window.deleteTask('${taskId}')">🗑️ حذف</button>
      ` : ""}
    </div>
  `;

  document.getElementById("modalBox").className = "modal-box" + (isUrgent ? " urgent-glow" : "");
}

// ==== فلترة وبحث وترتيب ====
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderAll();
  };
});

document.getElementById("searchBox").addEventListener("input", (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  renderTasks();
});

document.getElementById("sortSelect").addEventListener("change", (e) => {
  currentSort = e.target.value;
  renderTasks();
});

document.getElementById("themeBtn").onclick = () => {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  applyTheme();
};

// ==== Toast ====
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ==== عرض ====
function renderAll() {
  renderStats();
  renderTeam();
  renderTasks();
}

function renderStats() {
  const entries = Object.entries(allTasks);
  const total = entries.length;
  const done = entries.filter(([_, t]) => t.status === "مكتملة").length;
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ").length;
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  }).length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statDone").textContent = done;
  document.getElementById("statProgress").textContent = progress;
  document.getElementById("statOverdue").textContent = overdue;
}

function renderTeam() {
  const team = {};
  Object.values(allTasks).forEach(t => {
    if (!team[t.assignee]) team[t.assignee] = { total: 0, done: 0 };
    team[t.assignee].total++;
    if (t.status === "مكتملة") team[t.assignee].done++;
  });

  const html = Object.entries(team).map(([name, s]) => {
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return `
      <div class="team-row">
        <div class="team-name">${escapeHtml(name)}</div>
        <div class="team-bar"><div class="team-fill" style="width:${pct}%"></div></div>
        <div class="team-pct">${pct}% (${s.done}/${s.total})</div>
      </div>`;
  }).join("");

  document.getElementById("teamList").innerHTML = html || '<p class="empty">لا توجد بيانات</p>';
}

function renderTasks() {
  const list = document.getElementById("tasksList");
  let entries = Object.entries(allTasks);

  // ترتيب
  if (currentSort === "priority") {
    entries.sort((a, b) => {
      const pri = { "عاجل": 0, "مهم": 1, "عادي": 2 };
      const pa = pri[a[1].priority] ?? 2;
      const pb = pri[b[1].priority] ?? 2;
      if (pa !== pb) return pa - pb;
      return (b[1].createdAt || 0) - (a[1].createdAt || 0);
    });
  } else if (currentSort === "date") {
    entries.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  } else if (currentSort === "due") {
    entries.sort((a, b) => {
      if (!a[1].dueDate) return 1;
      if (!b[1].dueDate) return -1;
      return new Date(a[1].dueDate) - new Date(b[1].dueDate);
    });
  } else if (currentSort === "title") {
    entries.sort((a, b) => (a[1].title || "").localeCompare(b[1].title || "", "ar"));
  }

  // فلترة
  let filtered = entries.filter(([_, t]) => {
    if (currentFilter === "all") return true;
    if (currentFilter === "بهاء") return t.assignee === "بهاء";
    if (currentFilter === "محمود") return t.assignee === "محمود";
    if (currentFilter === "pending") return t.status !== "مكتملة";
    if (currentFilter === "done") return t.status === "مكتملة";
    if (currentFilter === "overdue") {
      const d = daysRemaining(t.dueDate);
      return d !== null && d < 0 && t.status !== "مكتملة";
    }
    return true;
  });

  // بحث
  if (currentSearch) {
    filtered = filtered.filter(([_, t]) => {
      const haystack = `${t.title} ${t.notes || ""} ${t.assignee} ${t.status} ${t.priority || ""}`.toLowerCase();
      return haystack.includes(currentSearch);
    });
  }

  if (filtered.length === 0) {
    list.innerHTML = '<p class="empty" style="grid-column:1/-1;">لا توجد مهام مطابقة</p>';
    return;
  }

  list.innerHTML = filtered.map(([id, t]) => {
    const statusClass = t.status === "مكتملة" ? "done"
      : t.status === "جاري التنفيذ" ? "progress" : "new";
    const priorityClass = t.priority === "عاجل" ? "urgent"
      : t.priority === "مهم" ? "important" : "normal";
    const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
    const d = daysRemaining(t.dueDate);
    const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";
    const commentsCount = t.comments ? Object.keys(t.comments).length : 0;

    return `
      <div class="task-card ${priorityClass} ${statusClass} ${isUrgent ? "urgent-glow" : ""}" onclick="window.openModal('${id}')">
        <div class="card-top">
          <span class="priority-dot ${priorityClass}"></span>
          <span class="assignee-chip">👤 ${escapeHtml(t.assignee)}</span>
        </div>
        <h3 class="card-title">${escapeHtml(t.title)}</h3>
        ${t.notes ? `<p class="card-notes">${escapeHtml(t.notes)}</p>` : ""}
        <div class="card-bottom">
          ${t.dueDate ? `<span class="card-due ${isOverdue ? 'overdue' : ''}">${dueLabel(t.dueDate)}</span>` : "<span></span>"}
          <div class="card-icons">
            ${commentsCount > 0 ? `<span class="card-icon">💬 ${commentsCount}</span>` : ""}
            <span class="status-pill ${statusClass}">${t.status}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

window.changeStatus = changeStatus;
window.addComment = addComment;
window.deleteTask = deleteTask;
window.editTask = editTask;
window.openModal = openModal;
window.closeModal = closeModal;

// إغلاق المودال بالضغط على الخلفية أو Escape
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

applyTheme();
</script>

<style>
:root[data-theme="dark"] {
  --bg: #0a0e1a;
  --bg-2: #131826;
  --bg-3: #1e2537;
  --bg-4: #2a3349;
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --border: #2a3349;
  --primary: #4f8ef7;
  --primary-2: #2563eb;
  --accent: #f59e0b;
  --urgent: #ff4d4f;
  --important: #f59e0b;
  --success: #22c55e;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
:root[data-theme="light"] {
  --bg: #f5f7fb;
  --bg-2: #ffffff;
  --bg-3: #f1f5f9;
  --bg-4: #e2e8f0;
  --text: #0f172a;
  --text-2: #64748b;
  --text-3: #94a3b8;
  --border: #e2e8f0;
  --primary: #2563eb;
  --primary-2: #1e40af;
  --accent: #d97706;
  --urgent: #dc2626;
  --important: #d97706;
  --success: #059669;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ==== شاشة الدخول ==== */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  background: radial-gradient(circle at top, #1e3a8a 0%, #0a0e1a 70%);
}
.login-card {
  background: rgba(19, 24, 38, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid #2a3349;
  padding: 50px 40px; border-radius: 24px;
  text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.login-logo { width: 100px; margin-bottom: 20px; }
.login-card h1 { color: #f1f5f9; margin-bottom: 8px; font-size: 30px; font-weight: 900; letter-spacing: -0.5px; }
.login-card p { color: #94a3b8; margin-bottom: 32px; font-size: 14px; }
#loginBtn {
  background: white; color: #1e293b; border: none;
  padding: 14px 24px; border-radius: 12px; cursor: pointer;
  font-size: 15px; font-weight: 700; font-family: inherit;
  display: flex; align-items: center; gap: 12px; justify-content: center;
  width: 100%; transition: 0.3s;
}
#loginBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,255,255,0.2); }
#loginBtn img { width: 22px; }

/* ==== الهيدر ==== */
#mainScreen { display: none; }
header {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow);
  gap: 12px;
  flex-wrap: wrap;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-brand img { width: 42px; height: 42px; object-fit: contain; }
.header-brand h1 { font-size: 20px; color: var(--text); font-weight: 800; line-height: 1; }
.header-brand .subtitle { font-size: 11px; color: var(--text-2); margin-top: 2px; }

.user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.role { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.role.admin { background: rgba(245,158,11,0.15); color: var(--accent); border: 1px solid rgba(245,158,11,0.3); }
.role.user { background: rgba(79,142,247,0.15); color: var(--primary); border: 1px solid rgba(79,142,247,0.3); }

.icon-btn {
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px; border-radius: 10px; cursor: pointer;
  font-size: 15px; transition: 0.2s;
}
.icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

#logoutBtn {
  background: rgba(220,38,38,0.1); color: var(--urgent);
  border: 1px solid rgba(220,38,38,0.3);
  padding: 8px 16px; border-radius: 10px; cursor: pointer;
  font-size: 12px; font-weight: 600; font-family: inherit;
  transition: 0.2s;
}
#logoutBtn:hover { background: var(--urgent); color: white; }

/* ==== الحاوية ==== */
.container { max-width: 1500px; margin: 20px auto; padding: 0 20px; }

.card-panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.panel-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text); }

/* ==== الإحصائيات ==== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.stat {
  background: var(--bg-3);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
  transition: 0.2s;
  position: relative;
  overflow: hidden;
}
.stat::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.stat.total::before { background: var(--primary); }
.stat.done::before { background: var(--success); }
.stat.progress::before { background: var(--important); }
.stat.overdue::before { background: var(--urgent); }
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-num { font-size: 30px; font-weight: 900; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat.total .stat-num { color: var(--primary); }
.stat.done .stat-num { color: var(--success); }
.stat.progress .stat-num { color: var(--important); }
.stat.overdue .stat-num { color: var(--urgent); }

/* ==== الفريق ==== */
.team-row {
  display: grid;
  grid-template-columns: 120px 1fr 130px;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.team-row:last-child { border-bottom: none; }
.team-name { font-weight: 600; font-size: 14px; }
.team-bar { height: 8px; background: var(--bg-4); border-radius: 4px; overflow: hidden; }
.team-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--success));
  transition: width 0.5s;
  border-radius: 4px;
}
.team-pct { font-size: 13px; color: var(--text-2); text-align: left; font-weight: 600; }

/* ==== الفورم ==== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 12px 14px;
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px; font-family: inherit;
  transition: 0.2s;
}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
}
.form-grid button {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: white; border: none;
  padding: 14px; border-radius: 10px; cursor: pointer;
  font-size: 15px; font-weight: 700; font-family: inherit;
  transition: 0.2s;
}
.form-grid button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79,142,247,0.4); }

/* ==== أدوات التحكم ==== */
.controls-bar {
  display: flex; gap: 12px; margin-bottom: 20px;
  flex-wrap: wrap; align-items: center;
}
.search-wrap {
  flex: 1; min-width: 200px; position: relative;
}
.search-wrap input {
  width: 100%; padding: 12px 16px 12px 44px;
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  font-size: 14px; font-family: inherit;
}
.search-wrap input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
}
.search-wrap::before {
  content: '🔍';
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%); font-size: 14px;
  pointer-events: none;
}
#sortSelect {
  padding: 12px 16px;
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  font-size: 13px; font-family: inherit; cursor: pointer;
}

/* ==== الفلاتر ==== */
.filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-btn {
  background: var(--bg-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 20px; cursor: pointer;
  font-size: 13px; font-family: inherit; font-weight: 500;
  transition: 0.2s;
}
.filter-btn:hover { border-color: var(--primary); color: var(--primary); }
.filter-btn.active {
  background: var(--primary); color: white; border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(79,142,247,0.3);
}

/* ==== شبكة المهام ==== */
#tasksList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ==== كارت المهمة ==== */
.task-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  display: flex; flex-direction: column;
  min-height: 170px;
  overflow: hidden;
}
.task-card::before {
  content: '';
  position: absolute; top: 0; right: 0; left: 0; height: 3px;
}
.task-card.normal::before { background: var(--success); }
.task-card.important::before { background: var(--important); }
.task-card.urgent::before { background: var(--urgent); }
.task-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--primary); }
.task-card.done { opacity: 0.65; }
.task-card.done:hover { opacity: 1; }

/* ✨ الفلاشر النيون للمهام العاجلة ✨ */
@keyframes urgentGlow {
  0%, 100% {
    box-shadow: 0 0 5px rgba(255,77,79,0.2),
                0 0 15px rgba(255,77,79,0.15);
    border-color: var(--border);
  }
  50% {
    box-shadow: 0 0 25px rgba(255,77,79,0.7),
                0 0 45px rgba(255,77,79,0.4);
    border-color: var(--urgent);
  }
}
.task-card.urgent-glow {
  animation: urgentGlow 1.8s ease-in-out infinite;
}

.card-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.priority-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.priority-dot.urgent { background: var(--urgent); box-shadow: 0 0 10px var(--urgent); }
.priority-dot.important { background: var(--important); }
.priority-dot.normal { background: var(--success); }

.assignee-chip {
  font-size: 11px; padding: 4px 10px;
  background: var(--bg-3); border-radius: 12px;
  color: var(--text-2); font-weight: 600;
}

.card-title {
  font-size: 15px; font-weight: 700; line-height: 1.4;
  color: var(--text); margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 42px;
}
.card-notes {
  font-size: 12px; color: var(--text-2); line-height: 1.5;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-bottom {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; flex-wrap: wrap;
}
.card-due {
  font-size: 11px; color: var(--text-2);
  padding: 4px 8px; background: var(--bg-3);
  border-radius: 6px; font-weight: 600;
}
.card-due.overdue { background: rgba(255,77,79,0.15); color: var(--urgent); }

.card-icons { display: flex; gap: 6px; align-items: center; }
.card-icon { font-size: 11px; color: var(--text-2); }

.status-pill {
  font-size: 10px; font-weight: 700;
  padding: 4px 10px; border-radius: 12px;
}
.status-pill.new { background: rgba(79,142,247,0.15); color: var(--primary); }
.status-pill.progress { background: rgba(245,158,11,0.15); color: var(--important); }
.status-pill.done { background: rgba(34,197,94,0.15); color: var(--success); }

.empty { text-align: center; padding: 40px; color: var(--text-2); }

/* ==== المودال ==== */
#modalOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s;
}
#modalOverlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 650px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.3s;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-box.urgent-glow {
  animation: urgentGlow 1.8s ease-in-out infinite, slideUp 0.3s;
}

.modal-header {
  padding: 20px 24px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.modal-header::before {
  content: '';
  position: absolute; top: 0; right: 0; left: 0; height: 4px;
}
.modal-header.normal::before { background: var(--success); }
.modal-header.important::before { background: var(--important); }
.modal-header.urgent::before { background: var(--urgent); }

.modal-badges { display: flex; gap: 8px; }
.priority-badge, .status-badge {
  padding: 5px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}
.priority-badge.urgent { background: rgba(255,77,79,0.15); color: var(--urgent); border: 1px solid rgba(255,77,79,0.3); }
.priority-badge.important { background: rgba(245,158,11,0.15); color: var(--important); border: 1px solid rgba(245,158,11,0.3); }
.priority-badge.normal { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
.status-badge.new { background: rgba(79,142,247,0.15); color: var(--primary); border: 1px solid rgba(79,142,247,0.3); }
.status-badge.progress { background: rgba(245,158,11,0.15); color: var(--important); border: 1px solid rgba(245,158,11,0.3); }
.status-badge.done { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }

.modal-close {
  background: var(--bg-3); color: var(--text);
  border: none; width: 34px; height: 34px;
  border-radius: 50%; cursor: pointer;
  font-size: 16px; transition: 0.2s;
}
.modal-close:hover { background: var(--urgent); color: white; }

.modal-title {
  padding: 20px 24px 12px;
  font-size: 22px; font-weight: 800;
  line-height: 1.4;
}

.modal-meta {
  padding: 0 24px 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.meta-item {
  background: var(--bg-3); padding: 10px 14px;
  border-radius: 10px; display: flex; flex-direction: column; gap: 2px;
}
.meta-label { font-size: 11px; color: var(--text-3); font-weight: 600; }
.meta-value { font-size: 13px; color: var(--text); font-weight: 600; }
.overdue-text { color: var(--urgent); }

.modal-section { padding: 16px 24px; border-top: 1px solid var(--border); }
.modal-section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--primary); }

.modal-notes {
  background: var(--bg-3); padding: 12px 14px;
  border-radius: 10px; font-size: 13px; line-height: 1.7;
  color: var(--text-2);
}

.modal-comments-list { max-height: 220px; overflow-y: auto; margin-bottom: 12px; }
.modal-comment {
  background: var(--bg-3); padding: 10px 14px;
  border-radius: 10px; margin-bottom: 8px;
}
.modal-comment-head {
  display: flex; justify-content: space-between;
  margin-bottom: 4px; font-size: 12px;
}
.modal-comment-author { color: var(--primary); font-weight: 700; }
.modal-comment-date { color: var(--text-3); font-size: 11px; }
.modal-comment-text { font-size: 13px; line-height: 1.6; color: var(--text); }
.empty-comments { text-align: center; color: var(--text-3); font-size: 13px; padding: 20px; }

.modal-comment-form { display: flex; gap: 8px; }
.modal-comment-form input {
  flex: 1; padding: 10px 14px;
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit;
}
.modal-comment-form input:focus { outline: none; border-color: var(--primary); }
.modal-comment-form button {
  padding: 10px 20px;
  background: var(--primary); color: white;
  border: none; border-radius: 10px; cursor: pointer;
  font-size: 13px; font-weight: 700; font-family: inherit;
}
.modal-comment-form button:hover { background: var(--primary-2); }

.modal-actions {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  background: var(--bg-3);
}
.modal-status-select {
  padding: 10px 14px;
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; cursor: pointer;
  margin-left: auto;
}
.btn-edit, .btn-del {
  padding: 10px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text);
  transition: 0.2s;
}
.btn-edit:hover { background: var(--primary); color: white; border-color: var(--primary); }
.btn-del:hover { background: var(--urgent); color: white; border-color: var(--urgent); }

/* ==== Toast ==== */
#toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-3); color: var(--text);
  padding: 14px 24px; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  border: 1px solid var(--primary);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0; transition: 0.3s; z-index: 9999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ==== Responsive ==== */
@media (max-width: 700px) {
  #tasksList { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .header-brand h1 { font-size: 16px; }
  .header-brand .subtitle { display: none; }
  .team-row { grid-template-columns: 1fr; gap: 6px; }
  .user-info { gap: 6px; font-size: 11px; }
  .role { padding: 3px 8px; font-size: 10px; }
  .modal-meta { grid-template-columns: 1fr; }
  .modal-actions { flex-wrap: wrap; }
  .modal-status-select { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="login-logo" alt="EMAK">
    <h1>EMAK Hub</h1>
    <p>نظام إدارة المهام — قسم نظم المعلومات</p>
    <button id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      تسجيل الدخول بجوجل
    </button>
  </div>
</div>

<div id="mainScreen">
  <header>
    <div class="header-brand">
      <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" alt="EMAK">
      <div>
        <h1>EMAK Hub</h1>
        <div class="subtitle">نظم معلومات إيماك</div>
      </div>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button id="themeBtn" class="icon-btn" title="تبديل الوضع">☀️</button>
      <button id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="container">

    <div class="card-panel">
      <div class="panel-title">📊 نظرة عامة</div>
      <div class="stats-grid">
        <div class="stat total">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">إجمالي المهام</div>
        </div>
        <div class="stat done">
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-label">مكتملة</div>
        </div>
        <div class="stat progress">
          <div class="stat-num" id="statProgress">0</div>
          <div class="stat-label">جارية</div>
        </div>
        <div class="stat overdue">
          <div class="stat-num" id="statOverdue">0</div>
          <div class="stat-label">متأخرة</div>
        </div>
      </div>
    </div>

    <div class="card-panel">
      <div class="panel-title">👥 أداء الفريق</div>
      <div id="teamList"></div>
    </div>

    <div class="card-panel" id="addTaskCard">
      <div class="panel-title">➕ إضافة مهمة جديدة</div>
      <form id="addTaskForm" class="form-grid">
        <input id="taskTitle" type="text" placeholder="عنوان المهمة *" required>
        <select id="taskAssignee" required>
          <option value="">-- المسؤول --</option>
          <option value="بهاء">بهاء محمد</option>
          <option value="محمود">محمود عادل</option>
        </select>
        <select id="taskPriority" required>
          <option value="عادي">🟢 عادي</option>
          <option value="مهم">🟡 مهم</option>
          <option value="عاجل">🔴 عاجل</option>
        </select>
        <input id="taskDue" type="date" title="تاريخ التسليم">
        <input id="taskNotes" type="text" placeholder="ملاحظات (اختياري)">
        <button type="submit">إضافة المهمة</button>
      </form>
    </div>

    <div class="controls-bar">
      <div class="search-wrap">
        <input id="searchBox" type="text" placeholder="ابحث في المهام...">
      </div>
      <select id="sortSelect">
        <option value="priority">ترتيب: الأولوية</option>
        <option value="date">ترتيب: الأحدث</option>
        <option value="due">ترتيب: تاريخ التسليم</option>
        <option value="title">ترتيب: أبجدي</option>
      </select>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="بهاء">بهاء</button>
      <button class="filter-btn" data-filter="محمود">محمود</button>
      <button class="filter-btn" data-filter="pending">معلقة</button>
      <button class="filter-btn" data-filter="overdue">متأخرة</button>
      <button class="filter-btn" data-filter="done">مكتملة</button>
    </div>

    <div id="tasksList"></div>
  </div>
</div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
