<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,

  getDatabase, ref, push, set, onValue, update, remove,
  serverTimestamp, get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ============================================================
   1) إعدادات Firebase
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBagaYYgtQgAGyntE1go9IsGy7T85cvuSY",
  authDomain: "emak-tasks.firebaseapp.com",
  databaseURL: "https://emak-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emak-tasks",
  storageBucket: "emak-tasks.firebasestorage.app",
  messagingSenderId: "752119205815",
  appId: "1:752119205815:web:a96725f43555fb0c742232"
};

const SUPER_ADMIN_EMAILS = ["ahmedmkh@gmail.com"];
const USERNAME_DOMAIN = "@emak.local";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ============================================================
   2) الحالة العامة
   ============================================================ */
let currentUser = null;
let currentUserProfile = null;
let isAdmin = false;
let allTasks = {};
let allTeam = {};
let allUsers = {};
let currentFilter = "all";
let currentSearch = "";
let currentSort = "priority";
let currentView = "grid";
let currentTheme = localStorage.getItem("theme") || "dark";
let openTaskId = null;
let pinnedTaskId = null;
let charts = {};
let logoDataUrl = null;
let unsubTasks = null;
let unsubTeam = null;
let unsubUsers = null;

/* ============================================================
   3) أدوات مساعدة
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function isValidTs(ts) {
  return typeof ts === "number" && isFinite(ts) && ts > 0;
}
function formatDate(ts) {
  if (!isValidTs(ts)) return "";
  return new Date(ts).toLocaleDateString("ar-EG", { year:"numeric", month:"short", day:"numeric" });
}
function formatDateTime(ts) {
  if (!isValidTs(ts)) return "";
  return new Date(ts).toLocaleString("ar-EG", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
}
function timeAgo(ts) {
  if (!isValidTs(ts)) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 0 || s < 60) return "الآن";
  if (s < 3600) return `قبل ${Math.floor(s/60)} د`;
  if (s < 86400) return `قبل ${Math.floor(s/3600)} س`;
  if (s < 604800) return `قبل ${Math.floor(s/86400)} ي`;
  return formatDate(ts);
}
function daysRemaining(dueDate) {
  if (!dueDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate); due.setHours(0,0,0,0);
  if (isNaN(due.getTime())) return null;
  return Math.round((due - today) / 86400000);
}
function dueLabel(dueDate) {
  const d = daysRemaining(dueDate);
  if (d === null) return "";
  if (d < 0) return `متأخر ${Math.abs(d)} يوم`;
  if (d === 0) return "يستحق اليوم";
  if (d === 1) return "غداً";
  if (d <= 3) return `باقي ${d} أيام`;
  return dueDate;
}
function isThisWeek(ts) { return isValidTs(ts) && (Date.now() - ts) <= 7*86400000; }
function isThisMonth(ts) { return isValidTs(ts) && (Date.now() - ts) <= 30*86400000; }

function themeBg() { return getComputedStyle(document.documentElement).getPropertyValue('--bg-2').trim(); }
function themeFg() { return getComputedStyle(document.documentElement).getPropertyValue('--text').trim(); }

function showToast(msg, type = "info") {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.className = "", 2800);
}
function swalSuccess(title, text="") {
  return Swal.fire({ icon:"success", title, text, timer:1800, showConfirmButton:false,
    background: themeBg(), color: themeFg() });
}
function swalError(title, text="") {
  return Swal.fire({ icon:"error", title, text,
    confirmButtonColor:"#dc2626", background: themeBg(), color: themeFg() });
}
function swalConfirm(title, text="لا يمكن التراجع!") {
  return Swal.fire({
    icon:"warning", title, text, showCancelButton:true,
    confirmButtonText:"نعم", cancelButtonText:"إلغاء",
    confirmButtonColor:"#dc2626", cancelButtonColor:"#64748b",
    background: themeBg(), color: themeFg()
  });
}

async function loadLogoAsBase64() {
  try {
    const res = await fetch(LOGO_URL, { mode:"cors" });
    const blob = await res.blob();
    return await new Promise(res => {
      const reader = new FileReader();
      reader.onloadend = () => res(reader.result);
      reader.readAsDataURL(blob);
    });
  } catch (e) { console.warn("Logo load failed:", e); return null; }
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", currentTheme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = currentTheme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", currentTheme);
  if (Object.keys(charts).length) renderCharts();
}

/* ============================================================
   4) تسجيل الدخول
   ============================================================ */
function togglePassword() {
  const inp = document.getElementById("loginPassword");
  if (!inp) return;
  inp.type = inp.type === "password" ? "text" : "password";
}

document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const username = document.getElementById("loginUsername").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    errBox.textContent = "اسم المستخدم: 3-20 حرف (a-z, 0-9, _)";
    return;
  }
  const email = username + USERNAME_DOMAIN;

  const btn = document.getElementById("loginSubmitBtn");
  btn.disabled = true; btn.textContent = "⏳ جارٍ الدخول...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    if (document.getElementById("rememberMe").checked) {
      localStorage.setItem("emak_last_username", username);
    } else {
      localStorage.removeItem("emak_last_username");
    }
  } catch (err) {
    const msgs = {
      "auth/user-not-found": "اسم المستخدم غير موجود",
      "auth/wrong-password": "كلمة المرور غير صحيحة",
      "auth/invalid-credential": "اسم المستخدم أو كلمة المرور غير صحيحة",
      "auth/too-many-requests": "محاولات كثيرة. حاول لاحقاً",
      "auth/user-disabled": "هذا الحساب معطّل. تواصل مع المدير"
    };
    errBox.textContent = msgs[err.code] || "فشل تسجيل الدخول";
  } finally {
    btn.disabled = false; btn.textContent = "تسجيل الدخول";
  }
};

document.getElementById("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (e) { swalError("فشل تسجيل الدخول بجوجل", e.message); }
};

window.addEventListener("DOMContentLoaded", () => {
  const last = localStorage.getItem("emak_last_username");
  if (last) {
    document.getElementById("loginUsername").value = last;
    document.getElementById("rememberMe").checked = true;
  }
});

/* ============================================================
   5) مراقبة حالة المصادقة
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  const loginScreen = document.getElementById("loginScreen");
  const mainScreen = document.getElementById("mainScreen");
  const loadingScreen = document.getElementById("loadingScreen");

  if (unsubTasks) { try { unsubTasks(); } catch(e){} unsubTasks = null; }
  if (unsubTeam)  { try { unsubTeam(); }  catch(e){} unsubTeam  = null; }
  if (unsubUsers) { try { unsubUsers(); } catch(e){} unsubUsers = null; }

  if (!user) {
    currentUser = null; currentUserProfile = null; isAdmin = false;
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
    loadingScreen.style.display = "none";
    return;
  }

  currentUser = user;
  loadingScreen.style.display = "flex";
  loginScreen.style.display = "none";

  try {
    if (!logoDataUrl) logoDataUrl = await loadLogoAsBase64();
    const profile = await ensureUserProfile(user);
    currentUserProfile = profile;
    isAdmin = profile.role === "admin";
    pinnedTaskId = localStorage.getItem(`pinnedTask_${user.uid}`) || null;

    // فحص التعطيل
    if (profile.active === false) {
      await signOut(auth);
      loadingScreen.style.display = "none";
      return swalError("هذا الحساب معطّل", "تواصل مع المدير لتنشيطه");
    }
  } catch (err) {
    console.error("Profile load error:", err);
    loadingScreen.style.display = "none";
    loginScreen.style.display = "flex";
    swalError("خطأ في تحميل الملف الشخصي", err.message + "\n\nتحقق من قواعد Firebase Rules");
    return;
  }

  setTimeout(() => {
    loadingScreen.style.display = "none";
    mainScreen.style.display = "block";
    document.getElementById("userName").textContent = currentUserProfile.displayName || currentUserProfile.username;
    document.getElementById("userRole").textContent = isAdmin ? "👑 مدير" : "👤 موظف";
    document.getElementById("userRole").className = "role " + (isAdmin ? "admin" : "user");
    document.getElementById("addTaskCard").style.display = isAdmin ? "block" : "none";
    document.getElementById("usersNavBtn").style.display = isAdmin ? "inline-flex" : "none";
    document.getElementById("teamNavBtn").style.display = isAdmin ? "inline-flex" : "none";
    startRealtimeListeners();
  }, 500);
});

async function ensureUserProfile(user) {
  const uref = ref(db, "users/" + user.uid);
  const snap = await get(uref);
  if (snap.exists()) {
    const data = snap.val();
    if (data.active === false) return data;
    try { await update(uref, { lastLogin: Date.now() }); } catch(e) {}
    return data;
  }
  // مستخدم جديد
  const isSuperAdmin = SUPER_ADMIN_EMAILS.includes(user.email || "");
  const username = (user.email || "").split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g,"") || "user";
  const displayName = user.displayName || username;
  const profile = {
    username, displayName,
    email: user.email || "",
    role: isSuperAdmin ? "admin" : "employee",
    active: true,
    createdAt: Date.now(),
    lastLogin: Date.now()
  };
  await set(uref, profile);
  if (username) {
    try {
      const unameSnap = await get(ref(db, "usernames/" + username));
      if (!unameSnap.exists()) {
        await set(ref(db, "usernames/" + username), { uid: user.uid, createdAt: Date.now() });
      }
    } catch(e) {}
  }
  try {
    const teamSnap = await get(ref(db, "team"));
    const team = teamSnap.val() || {};
    const already = Object.values(team).some(m => m.uid === user.uid);
    if (!already && !isSuperAdmin) {
      await push(ref(db, "team"), {
        uid: user.uid, username, name: displayName, createdAt: Date.now()
      });
    }
  } catch(e) {}
  return profile;
}

/* ============================================================
   6) المشتركات الفعلية
   ============================================================ */
function startRealtimeListeners() {
  if (unsubTasks) { try { unsubTasks(); } catch(e){} unsubTasks = null; }
  if (unsubTeam)  { try { unsubTeam(); }  catch(e){} unsubTeam  = null; }
  if (unsubUsers) { try { unsubUsers(); } catch(e){} unsubUsers = null; }

  unsubTasks = onValue(ref(db, "tasks"), (snap) => {
    allTasks = snap.val() || {};
    try { renderAll(); } catch(e) { console.warn("renderAll:", e); }
    if (openTaskId && allTasks[openTaskId]) renderModal(openTaskId);
    else if (openTaskId && !allTasks[openTaskId]) closeModal();
  }, (err) => {
    console.error("Tasks listener error:", err);
    if (err.code === "PERMISSION_DENIED") {
      swalError("لا تملك صلاحية قراءة المهام", "تواصل مع المدير لضبط قواعد Firebase Rules");
    }
  });

  unsubTeam = onValue(ref(db, "team"), (snap) => {
    allTeam = snap.val() || {};
    populateAssigneeSelect();
  }, (err) => console.warn("Team listener:", err));

  if (isAdmin) {
    unsubUsers = onValue(ref(db, "users"), (snap) => {
      allUsers = snap.val() || {};
      if (document.getElementById("usersView").classList.contains("active")) renderUsersList();
    }, (err) => console.warn("Users listener:", err));
  }
}

function populateAssigneeSelect() {
  const sel = document.getElementById("taskAssignee");
  if (!sel) return;
  const current = sel.value;
  const options = ['<option value="">-- المسؤول --</option>'];
  Object.entries(allTeam)
    .filter(([id, m]) => m && m.name)
    .sort((a, b) => (a[1].name || "").localeCompare(b[1].name || "", "ar"))
    .forEach(([id, m]) => {
      options.push(`<option value="${escapeHtml(id)}">${escapeHtml(m.name)}</option>`);
    });
  sel.innerHTML = options.join("");
  if (current && sel.querySelector(`option[value="${current}"]`)) sel.value = current;
}

/* ============================================================
   7) إضافة مهمة
   ============================================================ */
document.getElementById("addTaskForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!isAdmin || !currentUserProfile) return swalError("غير مصرح");
  const title = document.getElementById("taskTitle").value.trim();
  const assigneeId = document.getElementById("taskAssignee").value;
  const priority = document.getElementById("taskPriority").value;
  const dueDate = document.getElementById("taskDue").value;
  const notes = document.getElementById("taskNotes").value.trim();
  const tags = document.getElementById("taskTags").value.trim();
  if (!title || !assigneeId) return swalError("أكمل البيانات المطلوبة");
  const member = allTeam[assigneeId];
  if (!member) return swalError("عضو الفريق غير موجود");

  const newRef = push(ref(db, "tasks"));
  await set(newRef, {
    title, priority, dueDate, notes, tags,
    assigneeId,
    assignee: member.name,
    status: "جديدة",
    createdBy: currentUser.uid,
    createdByEmail: currentUser.email || "",
    createdByName: currentUserProfile.displayName,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  await logActivity("task_created", `أضاف مهمة: ${title}`, newRef.key);
  e.target.reset();
  populateAssigneeSelect();
  showToast("✅ تمت إضافة المهمة", "success");
};

/* ============================================================
   8) تغيير الحالة + تعليقات + حذف + تعديل
   ============================================================ */
async function changeStatus(taskId, newStatus) {
  if (!currentUserProfile) return;
  const t = allTasks[taskId]; if (!t) return;
  await update(ref(db, "tasks/" + taskId), {
    status: newStatus, updatedAt: Date.now(),
    updatedBy: currentUser.uid,
    updatedByName: currentUserProfile.displayName
  });
  await logActivity("status_changed", `غيّر حالة "${t.title}" إلى ${newStatus}`, taskId);
  showToast(`🔄 الحالة: ${newStatus}`, "info");
}

async function addComment(taskId, fromModal = false) {
  if (!currentUserProfile) return;
  const inputId = fromModal ? "modal-comment-input" : "comment-" + taskId;
  const input = document.getElementById(inputId);
  if (!input) return;
  const text = input.value.trim(); if (!text) return;
  const commentRef = push(ref(db, "tasks/" + taskId + "/comments"));
  await set(commentRef, {
    text,
    author: currentUserProfile.displayName,
    authorEmail: currentUser.email || "",
    authorId: currentUser.uid,
    createdAt: Date.now()
  });
  await update(ref(db, "tasks/" + taskId), {
    updatedAt: Date.now(),
    updatedBy: currentUser.uid,
    updatedByName: currentUserProfile.displayName
  });
  input.value = "";
  showToast("💬 تمت الإضافة", "success");
}

async function deleteTask(taskId) {
  if (!isAdmin) return swalError("غير مصرح");
  const t = allTasks[taskId]; if (!t) return;
  const r = await swalConfirm("حذف المهمة؟", `"${t.title}" — لا يمكن التراجع!`);
  if (!r.isConfirmed) return;
  await remove(ref(db, "tasks/" + taskId));
  await logActivity("task_deleted", `حذف مهمة: ${t.title}`, taskId);
  closeModal();
  showToast("🗑️ تم الحذف", "success");
}

async function editTask(taskId) {
  if (!isAdmin) return swalError("غير مصرح");
  const t = allTasks[taskId]; if (!t) return;

  const teamOptions = Object.entries(allTeam)
    .filter(([id, m]) => m && m.name)
    .map(([id, m]) => `<option value="${escapeHtml(id)}" ${t.assigneeId===id?"selected":""}>${escapeHtml(m.name)}</option>`).join("");

  const { value: formValues } = await Swal.fire({
    title: "✏️ تعديل المهمة",
    html: `
      <div style="display:flex;flex-direction:column;gap:10px;text-align:right;direction:rtl;">
        <label style="font-size:12px;font-weight:700;">العنوان</label>
        <input id="swal-title" class="swal2-input" value="${escapeHtml(t.title)}" style="margin:0;width:100%;">
        <label style="font-size:12px;font-weight:700;">المسؤول</label>
        <select id="swal-assignee" class="swal2-select" style="margin:0;width:100%;">${teamOptions}</select>
        <label style="font-size:12px;font-weight:700;">الأولوية</label>
        <select id="swal-priority" class="swal2-select" style="margin:0;width:100%;">
          <option value="عادي" ${t.priority==="عادي"?"selected":""}>🟢 عادي</option>
          <option value="مهم"  ${t.priority==="مهم"?"selected":""}>🟡 مهم</option>
          <option value="عاجل" ${t.priority==="عاجل"?"selected":""}>🔴 عاجل</option>
        </select>
        <label style="font-size:12px;font-weight:700;">تاريخ التسليم</label>
        <input id="swal-due" type="date" class="swal2-input" value="${t.dueDate||""}" style="margin:0;width:100%;">
        <label style="font-size:12px;font-weight:700;">الوسوم (فاصلة)</label>
        <input id="swal-tags" class="swal2-input" value="${escapeHtml(t.tags||"")}" style="margin:0;width:100%;">
        <label style="font-size:12px;font-weight:700;">ملاحظات</label>
        <textarea id="swal-notes" class="swal2-textarea" style="margin:0;width:100%;">${escapeHtml(t.notes||"")}</textarea>
      </div>`,
    showCancelButton: true,
    confirmButtonText: "حفظ",
    cancelButtonText: "إلغاء",
    confirmButtonColor: "#2563eb",
    focusConfirm: false,
    background: themeBg(), color: themeFg(),
    preConfirm: () => {
      const title = document.getElementById("swal-title").value.trim();
      if (!title) {
        Swal.showValidationMessage("العنوان مطلوب");
        return false;
      }
      return {
        title,
        assigneeId: document.getElementById("swal-assignee").value,
        priority: document.getElementById("swal-priority").value,
        dueDate: document.getElementById("swal-due").value,
        tags: document.getElementById("swal-tags").value.trim(),
        notes: document.getElementById("swal-notes").value.trim()
      };
    }
  });
  if (!formValues) return;
  const member = allTeam[formValues.assigneeId];
  if (!member) return swalError("بيانات ناقصة");

  await update(ref(db, "tasks/" + taskId), {
    title: formValues.title,
    assigneeId: formValues.assigneeId,
    assignee: member.name,
    priority: formValues.priority,
    dueDate: formValues.dueDate,
    tags: formValues.tags,
    notes: formValues.notes,
    updatedAt: Date.now(),
    updatedBy: currentUser.uid,
    updatedByName: currentUserProfile.displayName
  });
  await logActivity("task_edited", `عدّل مهمة: ${formValues.title}`, taskId);
  showToast("✏️ تم التعديل", "success");
}

function togglePin(taskId) {
  if (pinnedTaskId === taskId) {
    pinnedTaskId = null;
    localStorage.removeItem(`pinnedTask_${currentUser.uid}`);
    showToast("📌 تم إلغاء التثبيت", "info");
  } else {
    pinnedTaskId = taskId;
    localStorage.setItem(`pinnedTask_${currentUser.uid}`, taskId);
    showToast("⭐ تم التثبيت", "success");
  }
  renderTasks();
  if (openTaskId === taskId) renderModal(taskId);
}

/* ============================================================
   9) سجل النشاط
   ============================================================ */
async function logActivity(type, text, taskId=null) {
  if (!currentUser) return;
  try {
    await push(ref(db, "activity"), {
      type, text, taskId,
      uid: currentUser.uid,
      byName: currentUserProfile?.displayName || "—",
      at: Date.now()
    });
  } catch(e) { console.warn("log failed", e); }
}

/* ============================================================
   10) المودال
   ============================================================ */
function openModal(taskId) {
  openTaskId = taskId; renderModal(taskId);
  document.getElementById("modalOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  openTaskId = null;
  document.getElementById("modalOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

function renderModal(taskId) {
  const t = allTasks[taskId]; if (!t) return closeModal();
  const statusClass = t.status === "مكتملة" ? "done" : t.status === "جاري التنفيذ" ? "progress" : "new";
  const priorityClass = t.priority === "عاجل" ? "urgent" : t.priority === "مهم" ? "important" : "normal";
  const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
  const d = daysRemaining(t.dueDate);
  const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";
  const comments = t.comments ? Object.entries(t.comments).sort((a,b) => (a[1].createdAt||0)-(b[1].createdAt||0)) : [];
  const commentsHtml = comments.length > 0 ? comments.map(([cid, c]) => `
    <div class="modal-comment">
      <div class="modal-comment-head">
        <span class="modal-comment-author">${escapeHtml(c.author)}</span>
        <span class="modal-comment-date">${formatDateTime(c.createdAt)}</span>
      </div>
      <div class="modal-comment-text">${escapeHtml(c.text)}</div>
    </div>`).join("") : '<p class="empty-comments">لا توجد تعليقات بعد</p>';
  const tagsHtml = t.tags ? t.tags.split(",").map(x=>x.trim()).filter(Boolean)
    .map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join("") : "";

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-header ${priorityClass}">
      <div class="modal-badges">
        <span class="priority-badge ${priorityClass}">${t.priority === "عاجل" ? "🔴 عاجل" : t.priority === "مهم" ? "🟡 مهم" : "🟢 عادي"}</span>
        <span class="status-badge ${statusClass}">${escapeHtml(t.status)}</span>
      </div>
      <button class="modal-close" onclick="window.closeModal()">✕</button>
    </div>
    <h2 class="modal-title">${escapeHtml(t.title)}</h2>

    <div class="modal-meta">
      <div class="meta-item"><span class="meta-label">👤 المسؤول</span><span class="meta-value">${escapeHtml(t.assignee || "—")}</span></div>
      ${t.dueDate ? `<div class="meta-item"><span class="meta-label">📅 التسليم</span><span class="meta-value ${isOverdue?'overdue-text':''}">${escapeHtml(dueLabel(t.dueDate))}</span></div>` : ""}
      <div class="meta-item"><span class="meta-label">✏️ آخر تعديل</span><span class="meta-value">${t.updatedByName ? escapeHtml(t.updatedByName) + " — " + formatDate(t.updatedAt) : "—"}</span></div>
      <div class="meta-item"><span class="meta-label">🆕 أُنشئت</span><span class="meta-value">${formatDate(t.createdAt)}</span></div>
    </div>
    ${t.notes ? `<div class="modal-section"><div class="modal-section-title">📝 ملاحظات المهمة</div><div class="modal-notes">${escapeHtml(t.notes)}</div></div>` : ""}
    <div class="modal-section">
      <div class="modal-section-title">💬 التعليقات (${comments.length})</div>
      <div class="modal-comments-list">${commentsHtml}</div>
      <div class="modal-comment-form">
        <input id="modal-comment-input" type="text" placeholder="أضف تعليقاً...">
        <button onclick="window.addComment('${taskId}', true)">إرسال</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-pin ${pinnedTaskId === taskId ? 'active' : ''}" onclick="window.togglePin('${taskId}')">${pinnedTaskId === taskId ? '⭐ مثبتة' : '☆ تثبيت'}</button>
      <select onchange="window.changeStatus('${taskId}', this.value)" class="modal-status-select">
        <option ${t.status === "جديدة" ? "selected" : ""}>جديدة</option>
        <option ${t.status === "جاري التنفيذ" ? "selected" : ""}>جاري التنفيذ</option>
        <option ${t.status === "مكتملة" ? "selected" : ""}>مكتملة</option>
      </select>
      ${isAdmin ? `<button class="btn-edit" onclick="window.editTask('${taskId}')">✏️ تعديل</button>
        <button class="btn-del" onclick="window.deleteTask('${taskId}')">🗑️ حذف</button>` : ""}
    </div>`;
  document.getElementById("modalBox").className = "modal-box" + (isUrgent ? " urgent-glow" : "");
}

/* ============================================================
   12) الرسم العام
   ============================================================ */
function renderAll() {
  if (!currentUserProfile) return;
  try { renderStats(); } catch(e) { console.warn("stats:", e); }
  try { renderTeamProgress(); } catch(e) { console.warn("team:", e); }
  try { renderTasks(); } catch(e) { console.warn("tasks:", e); }
  try { renderCharts(); } catch(e) { console.warn("charts:", e); }
}

function renderStats() {
  const entries = Object.entries(allTasks);
  const total = entries.length;
  const done = entries.filter(([_, t]) => t.status === "مكتملة").length;
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ").length;
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  }).length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statDone").textContent = done;
  document.getElementById("statProgress").textContent = progress;
  document.getElementById("statOverdue").textContent = overdue;
}

function renderTeamProgress() {
  const team = {};
  Object.values(allTasks).forEach(t => {
    const k = t.assignee || "غير محدد";
    if (!team[k]) team[k] = { total: 0, done: 0 };
    team[k].total++;
    if (t.status === "مكتملة") team[k].done++;
  });
  const html = Object.entries(team).map(([name, s]) => {
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return `<div class="team-row">
      <div class="team-name">${escapeHtml(name)}</div>
      <div class="team-bar"><div class="team-fill" style="width:${pct}%"></div></div>
      <div class="team-pct">${pct}% (${s.done}/${s.total})</div>
    </div>`;
  }).join("");
  document.getElementById("teamList").innerHTML = html || '<p class="empty">لا توجد بيانات</p>';
}

function renderCharts() {
  const entries = Object.values(allTasks);
  const done = entries.filter(t => t.status === "مكتملة").length;
  const progress = entries.filter(t => t.status === "جاري التنفيذ").length;
  const newT = entries.filter(t => t.status === "جديدة").length;
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const textColor2 = getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim();

  const ctx1 = document.getElementById("chartStatus");
  if (ctx1) {
    if (charts.status) { try { charts.status.destroy(); } catch(e){} }
    charts.status = new Chart(ctx1, {
      type:"doughnut",
      data:{ labels:["مكتملة","جارية","جديدة"],
        datasets:[{ data:[done, progress, newT], backgroundColor:["#22c55e","#f59e0b","#4f8ef7"], borderColor:"transparent", borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:"bottom", labels:{ color:textColor, font:{ family:"Cairo", size:12 } } } } }
    });
  }

  const ctx2 = document.getElementById("chartProductivity");
  if (ctx2) {
    const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const counts = [0,0,0,0,0,0,0];
    entries.filter(t => t.status === "مكتملة" && isThisWeek(t.updatedAt)).forEach(t => {
      const d = new Date(t.updatedAt).getDay(); counts[d]++;
    });
    const reordered = [counts[6], counts[0], counts[1], counts[2], counts[3], counts[4], counts[5]];
    if (charts.productivity) { try { charts.productivity.destroy(); } catch(e){} }
    charts.productivity = new Chart(ctx2, {
      type:"bar",
      data:{ labels:days, datasets:[{ label:"مهام مكتملة هذا الأسبوع", data:reordered, backgroundColor:"#4f8ef7", borderRadius:8, borderSkipped:false }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
          y:{ beginAtZero:true, ticks:{ color:textColor2, stepSize:1, font:{ family:"Cairo" } }, grid:{ color:"rgba(128,128,128,0.1)" } },
          x:{ ticks:{ color:textColor2, font:{ family:"Cairo" } }, grid:{ display:false } }
        } }
    });
  }
}

function renderTasks() {
  if (!currentUserProfile) return;
  const list = document.getElementById("tasksList");
  if (!list) return;
  let entries = Object.entries(allTasks);

  entries.sort((a, b) => {
    if (a[0] === pinnedTaskId) return -1;
    if (b[0] === pinnedTaskId) return 1;
    if (currentSort === "priority") {
      const pri = { "عاجل": 0, "مهم": 1, "عادي": 2 };
      const pa = pri[a[1].priority] ?? 2, pb = pri[b[1].priority] ?? 2;
      if (pa !== pb) return pa - pb;
      return (b[1].createdAt || 0) - (a[1].createdAt || 0);
    }
    if (currentSort === "date") return (b[1].createdAt || 0) - (a[1].createdAt || 0);
    if (currentSort === "due") {
      if (!a[1].dueDate) return 1; if (!b[1].dueDate) return -1;
      return new Date(a[1].dueDate) - new Date(b[1].dueDate);
    }
    if (currentSort === "title") return (a[1].title || "").localeCompare(b[1].title || "", "ar");
    return 0;
  });

  let filtered = entries.filter(([_, t]) => {
    if (currentFilter === "all") return true;
    if (currentFilter === "pending") return t.status !== "مكتملة";
    if (currentFilter === "done") return t.status === "مكتملة";
    if (currentFilter === "overdue") {
      const d = daysRemaining(t.dueDate);
      return d !== null && d < 0 && t.status !== "مكتملة";
    }
    if (currentFilter === "week") return isThisWeek(t.createdAt);
    if (currentFilter === "month") return isThisMonth(t.createdAt);
    if (currentFilter === "mine") return t.assigneeId && currentUser && t.assigneeId === currentUser.uid;
    const member = Object.values(allTeam).find(m => m.name === currentFilter);
    if (member) return t.assigneeId === Object.keys(allTeam).find(k => allTeam[k].name === currentFilter);
    return true;
  });

  if (currentSearch) {
    filtered = filtered.filter(([_, t]) => {
      const hay = `${t.title} ${t.notes || ""} ${t.assignee} ${t.status} ${t.priority || ""} ${t.tags || ""}`.toLowerCase();
      return hay.includes(currentSearch);
    });
  }

  if (currentView === "kanban") {
    renderKanban(list, filtered);
  } else {
    list.className = "";
    if (filtered.length === 0) {
      list.innerHTML = '<p class="empty" style="grid-column:1/-1;">لا توجد مهام مطابقة</p>';
      return;
    }
    list.innerHTML = filtered.map(([id, t]) => taskCardHtml(id, t)).join("");
  }
}

function taskCardHtml(id, t) {
  const statusClass = t.status === "مكتملة" ? "done" : t.status === "جاري التنفيذ" ? "progress" : "new";
  const priorityClass = t.priority === "عاجل" ? "urgent" : t.priority === "مهم" ? "important" : "normal";
  const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
  const d = daysRemaining(t.dueDate);
  const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";
  const commentsCount = t.comments ? Object.keys(t.comments).length : 0;
  const isPinned = pinnedTaskId === id;
  const tagsHtml = t.tags ? t.tags.split(",").map(x=>x.trim()).filter(Boolean).slice(0,2)
    .map(x=>`<span class="card-tag">${escapeHtml(x)}</span>`).join("") : "";
  return `<div class="task-card ${priorityClass} ${statusClass} ${isUrgent ? "urgent-glow" : ""} ${isPinned ? "pinned" : ""}" onclick="window.openModal('${id}')">
    ${isPinned ? '<div class="pin-badge">⭐</div>' : ""}
    <div class="card-top">
      <span class="priority-dot ${priorityClass}"></span>
      <span class="assignee-chip">👤 ${escapeHtml(t.assignee || "—")}</span>
    </div>
    <h3 class="card-title">${escapeHtml(t.title)}</h3>
    ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
    ${t.notes ? `<p class="card-notes">${escapeHtml(t.notes)}</p>` : ""}
    <div class="card-bottom">
      ${t.dueDate ? `<span class="card-due ${isOverdue?'overdue':''}">${escapeHtml(dueLabel(t.dueDate))}</span>` : "<span></span>"}
      <div class="card-icons">
        ${commentsCount > 0 ? `<span class="card-icon">💬 ${commentsCount}</span>` : ""}
        <span class="status-pill ${statusClass}">${escapeHtml(t.status)}</span>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   13) Kanban Board
   ============================================================ */
function renderKanban(list, filtered) {
  list.className = "kanban-board";
  const cols = { "جديدة": [], "جاري التنفيذ": [], "مكتملة": [] };
  filtered.forEach(([id, t]) => {
    const key = cols[t.status] !== undefined ? t.status : "جديدة";
    cols[key].push([id, t]);
  });

  list.innerHTML = Object.entries(cols).map(([status, items]) => `
    <div class="kanban-col" data-status="${escapeHtml(status)}"
         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="window.kanbanDrop(event, '${escapeHtml(status)}')">
      <div class="kanban-col-header">
        <span>${status === "جديدة" ? "🆕" : status === "جاري التنفيذ" ? "⏳" : "✅"} ${escapeHtml(status)}</span>
        <span class="kanban-count">${items.length}</span>
      </div>
      <div class="kanban-col-body">
        ${items.map(([id, t]) => `
          <div class="kanban-card" draggable="true" ondragstart="window.kanbanDrag(event, '${id}')" onclick="window.openModal('${id}')">
            <div class="kanban-card-title">${escapeHtml(t.title)}</div>
            <div class="kanban-card-meta">
              <span class="assignee-chip">👤 ${escapeHtml(t.assignee || "—")}</span>
              ${t.dueDate ? `<span class="card-due ${daysRemaining(t.dueDate)<0 && t.status!=="مكتملة" ? "overdue" : ""}">${escapeHtml(dueLabel(t.dueDate))}</span>` : ""}
            </div>
          </div>
        `).join("") || '<p class="empty">لا توجد مهام</p>'}
      </div>
    </div>
  `).join("");
}
let _draggingId = null;
window.kanbanDrag = (e, id) => { _draggingId = id; e.dataTransfer.effectAllowed = "move"; };
window.kanbanDrop = async (e, status) => {
  e.preventDefault(); e.currentTarget.classList.remove("dragover");
  if (!_draggingId) return;
  const t = allTasks[_draggingId];
  if (!t || t.status === status) { _draggingId = null; return; }
  await changeStatus(_draggingId, status);
  _draggingId = null;
};

/* ============================================================
   15) لوحة المستخدمين (أدمن)
   ============================================================ */
async function renderUsersList() {
  if (!isAdmin) return;
  const wrap = document.getElementById("usersList");
  if (!wrap) return;
  const users = Object.entries(allUsers);
  if (users.length === 0) {
    wrap.innerHTML = '<p class="empty">لا يوجد مستخدمون</p>';
    return;
  }
  wrap.innerHTML = users.map(([uid, u]) => `
    <div class="user-row">
      <div class="user-avatar">${escapeHtml((u.displayName || "?").charAt(0))}</div>
      <div class="user-info-cell">
        <div class="user-name">${escapeHtml(u.displayName || u.username || "—")} ${uid === currentUser.uid ? "<span class='me-tag'>أنت</span>" : ""}</div>
        <div class="user-meta">
          <span>@${escapeHtml(u.username || "—")}</span>
          <span class="role-badge ${u.role === "admin" ? "admin" : "user"}">${u.role === "admin" ? "👑 مدير" : "👤 موظف"}</span>
          <span class="status-badge ${u.active !== false ? "active" : "inactive"}">${u.active !== false ? "نشط" : "معطّل"}</span>
        </div>
      </div>
      <div class="user-actions">
        ${u.role !== "admin" ? `<button class="btn-sm primary" onclick="window.promoteUser('${uid}')">ترقية</button>` : ""}
        ${u.role === "admin" && uid !== currentUser.uid ? `<button class="btn-sm" onclick="window.demoteUser('${uid}')">إزالة إدارة</button>` : ""}
        ${u.active !== false
          ? `<button class="btn-sm warn" onclick="window.toggleUserActive('${uid}', false)">تعطيل</button>`
          : `<button class="btn-sm success" onclick="window.toggleUserActive('${uid}', true)">تنشيط</button>`}
        <button class="btn-sm" onclick="window.resetUserPassword('${uid}')">🔑 إعادة تعيين كلمة المرور</button>
        ${uid !== currentUser.uid ? `<button class="btn-sm danger" onclick="window.deleteUser('${uid}')">حذف</button>` : ""}
      </div>
    </div>
  `).join("");
}

window.promoteUser = async (uid) => {
  if (!isAdmin) return;
  const r = await swalConfirm("ترقية إلى مدير؟", "");
  if (!r.isConfirmed) return;
  await update(ref(db, "users/" + uid), { role: "admin" });
  await logActivity("user_promoted", `رقّى مستخدم`);
  showToast("👑 تمت الترقية", "success");
};

window.demoteUser = async (uid) => {
  if (!isAdmin) return;
  const adminCount = Object.values(allUsers).filter(x => x.role === "admin" && x.active !== false).length;
  if (adminCount <= 1) return swalError("لا يمكن", "لا يمكن إزالة آخر مدير في النظام");
  const r = await swalConfirm("إزالة صلاحية الإدارة؟", "");
  if (!r.isConfirmed) return;
  await update(ref(db, "users/" + uid), { role: "employee" });
  showToast("تمت إزالة الإدارة", "info");
};

window.toggleUserActive = async (uid, active) => {
  if (!isAdmin) return;
  if (!active) {
    const adminCount = Object.values(allUsers).filter(x => x.role === "admin" && x.active !== false).length;
    if (allUsers[uid]?.role === "admin" && adminCount <= 1)
      return swalError("لا يمكن", "لا يمكن تعطيل آخر مدير");
  }
  await update(ref(db, "users/" + uid), { active });
  showToast(active ? "✅ تم التنشيط" : "⛔ تم التعطيل", active ? "success" : "warn");
};

window.deleteUser = async (uid) => {
  if (!isAdmin) return;
  const u = allUsers[uid]; if (!u) return;
  const adminCount = Object.values(allUsers).filter(x => x.role === "admin" && x.active !== false).length;
  if (u.role === "admin" && adminCount <= 1)
    return swalError("لا يمكن الحذف", "لا يمكن حذف آخر مدير في النظام");
  const r = await swalConfirm("حذف المستخدم؟", `@${u.username} — لا يمكن التراجع`);
  if (!r.isConfirmed) return;
  try {
    await remove(ref(db, "users/" + uid));
    if (u.username) await remove(ref(db, "usernames/" + u.username));
    const teamSnap = await get(ref(db, "team"));
    const team = teamSnap.val() || {};
    for (const [tid, m] of Object.entries(team)) {
      if (m.uid === uid) await remove(ref(db, "team/" + tid));
    }
    showToast("🗑️ تم الحذف", "success");
  } catch (err) {
    swalError("فشل الحذف", err.message);
  }
};

/* ============================================================
   16) إعادة تعيين كلمة مرور مستخدم (من قِبل الأدمن)
   ============================================================ */
window.resetUserPassword = async (uid) => {
  if (!isAdmin) return;
  const u = allUsers[uid]; if (!u) return;
  const { value: newPass } = await Swal.fire({
    title: `🔑 إعادة تعيين كلمة المرور`,
    html: `
      <div style="text-align:right;direction:rtl;font-size:13px;line-height:1.8;">
        <p>المستخدم: <b>${escapeHtml(u.displayName || u.username)}</b></p>
        <p style="color:#94a3b8;font-size:12px;">كلمة المرور الجديدة (6 أحرف على الأقل)</p>
      </div>`,
    input: "text",
    inputPlaceholder: "كلمة المرور الجديدة",
    inputAttributes: { autocapitalize: "off", autocorrect: "off" },
    showCancelButton: true,
    confirmButtonText: "تعيين",
    cancelButtonText: "إلغاء",
    confirmButtonColor: "#2563eb",
    focusConfirm: false,
    background: themeBg(), color: themeFg(),
    preConfirm: (val) => {
      if (!val || val.length < 6) {
        Swal.showValidationMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
        return false;
      }
      return val;
    }
  });
  if (!newPass) return;

  // Firebase Admin SDK غير متاح في العميل، لذا نستخدم sendPasswordResetEmail
  // الذي يرسل رابط إعادة تعيين للإيميل الداخلي (لن يعمل لأنه @emak.local)
  // البديل: نحفظ كلمة المرور في قاعدة البيانات كـ "resetPending" مع كلمة المرور
  // لكن الأفضل أمنياً: نطلب من المستخدم نفسه تغيير كلمة المرور من الملف الشخصي.
  
  // الحل العملي: نعرض رسالة توضح للمدير أن يطلب من المستخدم تغييرها بنفسه
  const confirmed = await Swal.fire({
    icon: "info",
    title: "طريقة إعادة التعيين",
    html: `
      <div style="text-align:right;direction:rtl;font-size:13px;line-height:1.8;">
        <p>لأسباب أمنية، لا يمكن للمدير تغيير كلمة مرور المستخدم مباشرة.</p>

    html: `
      <div style="display:flex;flex-direction:column;gap:10px;text-align:right;direction:rtl;">
        <label style="font-size:12px;font-weight:700;">كلمة المرور الحالية</label>

      </div>`,
    showCancelButton: true,

    cancelButtonText: "إلغاء",
    confirmButtonColor: "#2563eb",

    background: themeBg(), color: themeFg(),
    preConfirm: () => {
      const cur = document.getElementById("cp-current").value;
      const nw = document.getElementById("cp-new").value;
      const cf = document.getElementById("cp-confirm").value;
      if (!cur || !nw || !cf) {
        Swal.showValidationMessage("املأ جميع الحقول");
        return false;
      }

        return false;
      }
      return { currentPassword: cur, newPassword: nw };

  try {
    // إعادة المصادقة أولاً
    const credential = EmailAuthProvider.credential(
      currentUser.email,
      formValues.currentPassword
    );
    await reauthenticateWithCredential(currentUser, credential);
    // تغيير كلمة المرور
    await updatePassword(currentUser, formValues.newPassword);
    await logActivity("password_changed", "غيّر كلمة المرور الخاصة به");
    swalSuccess("✅ تم تغيير كلمة المرور", "استخدم كلمة المرور الجديدة في تسجيل الدخول القادم");
  } catch (err) {

    const msgs = {

      "auth/invalid-credential": "كلمة المرور الحالية غير صحيحة",

      "auth/requires-recent-login": "الرجاء تسجيل الخروج والدخول مرة أخرى ثم إعادة المحاولة",
      "auth/too-many-requests": "محاولات كثيرة، حاول لاحقاً"

        return false;
      }

    const newUid = cred.user.uid;

      username, displayName, email, role,
      active: true, createdAt: Date.now(), lastLogin: null
    });

    await push(ref(db, "team"), {

        </div>`,
      confirmButtonText: "حسناً",
      confirmButtonColor: "#2563eb",
      background: themeBg(), color: themeFg()
    });
  } catch (err) {
    console.error(err);
    const msgs = {
      "auth/email-already-in-use": "اسم المستخدم مستخدم بالفعل",
      "auth/weak-password": "كلمة المرور ضعيفة جداً",
      "auth/invalid-email": "صيغة غير صحيحة"

      try { await deleteApp(secondaryApp); } catch(e){}

  }

function openReport() {
  const entries = Object.entries(allTasks);
  const done = entries.filter(([_, t]) => t.status === "مكتملة");
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ");
  const newT = entries.filter(([_, t]) => t.status === "جديدة");
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  });

  const team = {};
  entries.forEach(([_, t]) => {
    const k = t.assignee || "غير محدد";
    if (!team[k]) team[k] = { total: 0, done: 0, progress: 0, overdue: 0 };
    team[k].total++;
    if (t.status === "مكتملة") team[k].done++;
    else if (t.status === "جاري التنفيذ") team[k].progress++;
    const d = daysRemaining(t.dueDate);
    if (d !== null && d < 0 && t.status !== "مكتملة") team[k].overdue++;
  });

  const teamRows = Object.entries(team).map(([name, s]) => `
    <tr>
      <td>${escapeHtml(name)}</td>
      <td>${s.total}</td>
      <td>${s.done}</td>
      <td>${s.progress}</td>
      <td>${s.overdue}</td>
      <td>${s.total ? Math.round((s.done/s.total)*100) : 0}%</td>
    </tr>`).join("");

  const taskRow = (id, t) => `
    <div class="r-task">
      <div class="r-task-head">
        <span class="r-badge ${t.priority === 'عاجل' ? 'r-urgent' : t.priority === 'مهم' ? 'r-important' : 'r-normal'}">${escapeHtml(t.priority || 'عادي')}</span>
        <span class="r-status">${escapeHtml(t.status)}</span>
      </div>
      <div class="r-title">${escapeHtml(t.title)}</div>
      <div class="r-meta">
        <span>👤 ${escapeHtml(t.assignee || "—")}</span>
        ${t.dueDate ? `<span>📅 ${escapeHtml(t.dueDate)}</span>` : ""}
        ${t.updatedByName ? `<span>✏️ آخر تعديل: ${escapeHtml(t.updatedByName)}</span>` : ""}
      </div>
      ${t.notes ? `<div class="r-notes">📝 ${escapeHtml(t.notes)}</div>` : ""}
      ${t.comments ? `<div class="r-comments">💬 ${Object.keys(t.comments).length} تعليق</div>` : ""}
    </div>`;

  const today = new Date().toLocaleDateString("ar-EG", { year:"numeric", month:"long", day:"numeric" });

  document.getElementById("reportBody").innerHTML = `
    <div class="report-content">
      <div class="r-header">
        <div class="r-logo-wrap"><img src="${LOGO_URL}" class="r-logo" crossorigin="anonymous"></div>
        <div class="r-header-text">
          <h1>EMAK Hub</h1>
          <p>تقرير المهام — قسم نظم المعلومات</p>
          <p class="r-date">التاريخ: ${today}</p>
        </div>
      </div>
      <div class="r-summary">
        <div class="r-sum-item"><div class="r-sum-num">${entries.length}</div><div class="r-sum-label">إجمالي</div></div>
        <div class="r-sum-item done"><div class="r-sum-num">${done.length}</div><div class="r-sum-label">مكتملة</div></div>
        <div class="r-sum-item progress"><div class="r-sum-num">${progress.length}</div><div class="r-sum-label">جارية</div></div>
        <div class="r-sum-item overdue"><div class="r-sum-num">${overdue.length}</div><div class="r-sum-label">متأخرة</div></div>
      </div>
      <div class="r-section">
        <h2>👥 أداء الفريق</h2>
        <table class="r-table">
          <thead><tr><th>الموظف</th><th>الإجمالي</th><th>مكتملة</th><th>جارية</th><th>متأخرة</th><th>النسبة</th></tr></thead>
          <tbody>${teamRows}</tbody>
        </table>
      </div>
      ${overdue.length > 0 ? `<div class="r-section"><h2>⚠️ المهام المتأخرة (${overdue.length})</h2>${overdue.map(([id,t])=>taskRow(id,t)).join("")}</div>` : ""}
      ${progress.length > 0 ? `<div class="r-section"><h2>⏳ المهام الجارية (${progress.length})</h2>${progress.map(([id,t])=>taskRow(id,t)).join("")}</div>` : ""}
      ${newT.length > 0 ? `<div class="r-section"><h2>🆕 المهام الجديدة (${newT.length})</h2>${newT.map(([id,t])=>taskRow(id,t)).join("")}</div>` : ""}
      ${done.length > 0 ? `<div class="r-section"><h2>✅ المهام المكتملة (${done.length})</h2>${done.map(([id,t])=>taskRow(id,t)).join("")}</div>` : ""}
      <div class="r-footer">تم إنشاء التقرير تلقائياً بواسطة EMAK Hub — ${today}</div>
    </div>`;

  document.getElementById("reportOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeReport() {
  document.getElementById("reportOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

async function downloadPDF() {
  const btn = document.getElementById("downloadPdfBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري التحميل...";
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    const pageW = 210, pageH = 297, margin = 15;
    let y = margin;
    const entries = Object.entries(allTasks);
    const done = entries.filter(([_, t]) => t.status === "مكتملة");
    const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ");
    const newT = entries.filter(([_, t]) => t.status === "جديدة");
    const overdue = entries.filter(([_, t]) => {
      const d = daysRemaining(t.dueDate);
      return d !== null && d < 0 && t.status !== "مكتملة";
    });
    const team = {};
    entries.forEach(([_, t]) => {
      const k = t.assignee || "غير محدد";
      if (!team[k]) team[k] = { total:0, done:0, progress:0, overdue:0 };
      team[k].total++;
      if (t.status === "مكتملة") team[k].done++;
      else if (t.status === "جاري التنفيذ") team[k].progress++;
      const d = daysRemaining(t.dueDate);
      if (d !== null && d < 0 && t.status !== "مكتملة") team[k].overdue++;
    });

    pdf.setFillColor(30, 58, 138);
    pdf.rect(0, 0, pageW, 25, "F");
    if (logoDataUrl) {
      try { pdf.addImage(logoDataUrl, "PNG", pageW - margin - 18, 3.5, 18, 18); } catch(e){}
    }
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(20); pdf.text("EMAK Hub", pageW - 40, 12, { align:"right" });
    pdf.setFontSize(11); pdf.text("تقرير المهام - قسم نظم المعلومات", pageW - 40, 19, { align:"right" });
    y = 35;
    const today = new Date().toLocaleDateString("ar-EG", { year:"numeric", month:"long", day:"numeric" });
    pdf.setTextColor(100,116,139); pdf.setFontSize(10);
    pdf.text(`التاريخ: ${today}`, pageW - margin, y, { align:"right" }); y += 10;
    pdf.setFillColor(241,245,249); pdf.roundedRect(margin, y, pageW - 2*margin, 25, 3, 3, "F");
    pdf.setTextColor(30,58,138); pdf.setFontSize(13);
    pdf.text("ملخص عام", pageW - margin - 5, y + 7, { align:"right" });
    pdf.setFontSize(11); pdf.setTextColor(15,23,42);
    pdf.text(`إجمالي: ${entries.length}  |  مكتملة: ${done.length}  |  جارية: ${progress.length}  |  متأخرة: ${overdue.length}`,
      pageW - margin - 5, y + 18, { align:"right" });
    y += 35;
    pdf.setTextColor(30,58,138); pdf.setFontSize(14);
    pdf.text("أداء الفريق", pageW - margin, y, { align:"right" }); y += 8;
    pdf.setFillColor(30,58,138); pdf.rect(margin, y, pageW - 2*margin, 8, "F");
    pdf.setTextColor(255,255,255); pdf.setFontSize(10);
    const colWidths = [40, 22, 22, 22, 22, 22];
    let colX = pageW - margin - 5;
    ["الموظف","الإجمالي","مكتملة","جارية","متأخرة","النسبة"].forEach((h, i) => {
      pdf.text(h, colX, y + 5.5, { align:"right" }); colX -= colWidths[i];
    });
    y += 8;
    pdf.setTextColor(15,23,42);
    Object.entries(team).forEach(([name, s], idx) => {
      if (y > pageH - 30) { pdf.addPage(); y = margin; }
      if (idx % 2 === 0) { pdf.setFillColor(248,250,252); pdf.rect(margin, y, pageW - 2*margin, 7, "F"); }
      colX = pageW - margin - 5;
      const row = [name, String(s.total), String(s.done), String(s.progress), String(s.overdue),
        `${s.total ? Math.round((s.done/s.total)*100) : 0}%`];
      row.forEach((cell, i) => { pdf.text(cell, colX, y + 5, { align:"right" }); colX -= colWidths[i]; });
      y += 7;
    });
    y += 12;

    const writeTaskSection = (title, tasks, color) => {
      if (tasks.length === 0) return;
      if (y > pageH - 40) { pdf.addPage(); y = margin; }
      pdf.setTextColor(...color); pdf.setFontSize(14);
      pdf.text(title, pageW - margin, y, { align:"right" }); y += 9;
      tasks.forEach(([id, t]) => {
        const lines = t.notes ? pdf.splitTextToSize(t.notes, pageW - 2*margin - 20) : [];
        const taskHeight = 22 + (lines.length * 5);
        if (y + taskHeight > pageH - 20) { pdf.addPage(); y = margin; }
        pdf.setFillColor(248,250,252);
        pdf.roundedRect(margin, y, pageW - 2*margin, taskHeight, 2, 2, "F");
        let barColor = [100,116,139];
        if (t.priority === "عاجل") barColor = [220,38,38];
        else if (t.priority === "مهم") barColor = [217,119,6];
        else if (t.priority === "عادي") barColor = [5,150,105];
        pdf.setFillColor(...barColor);
        pdf.rect(pageW - margin - 3, y, 3, taskHeight, "F");
        pdf.setTextColor(15,23,42); pdf.setFontSize(11);
        const title = t.title.length > 60 ? t.title.substring(0,57) + "..." : t.title;
        pdf.text(title, pageW - margin - 8, y + 6, { align:"right" });
        pdf.setFontSize(9); pdf.setTextColor(100,116,139);
        const dueText = t.dueDate ? `  |  📅 ${t.dueDate}` : "";
        pdf.text(`👤 ${t.assignee || "—"}  |  ${t.priority || "عادي"}  |  ${t.status}${dueText}`,
          pageW - margin - 8, y + 13, { align:"right" });
        if (lines.length > 0) {
          pdf.setTextColor(71,85,105); pdf.setFontSize(9);
          pdf.text(lines, pageW - margin - 8, y + 19, { align:"right" });
        }
        y += taskHeight + 3;
      });
      y += 5;
    };
    writeTaskSection(`المهام المتأخرة (${overdue.length})`, overdue, [220,38,38]);
    writeTaskSection(`المهام الجارية (${progress.length})`, progress, [217,119,6]);
    writeTaskSection(`المهام الجديدة (${newT.length})`, newT, [37,99,235]);
    writeTaskSection(`المهام المكتملة (${done.length})`, done, [5,150,105]);

    const totalPages = pdf.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(148,163,184);
      pdf.text(`EMAK Hub — صفحة ${i} من ${totalPages}`, pageW / 2, pageH - 8, { align:"center" });
    }
    pdf.save(`EMAK-Report-${new Date().toISOString().slice(0,10)}.pdf`);
    showToast("📄 تم تحميل التقرير", "success");
  } catch (e) {
    console.error(e); swalError("خطأ في التحميل", e.message);
  } finally {
    btn.disabled = false; btn.textContent = "📄 تحميل PDF";
  }
}

/* ============================================================
   21) تصدير CSV
   ============================================================ */
window.exportCSV = () => {
  const rows = [["العنوان","المسؤول","الحالة","الأولوية","تاريخ التسليم","الوسوم","ملاحظات"]];
  Object.values(allTasks).forEach(t => {
    rows.push([
      t.title || "", t.assignee || "", t.status || "", t.priority || "",
      t.dueDate || "", t.tags || "", (t.notes || "").replace(/[\n\r,]/g," ")
    ]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `EMAK-Tasks-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("📊 تم تصدير Excel", "success");
};

.kanban-card:hover{border-color:var(--primary);transform:translateX(-3px);}
.kanban-card-title{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.4;}
.kanban-card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;}

.users-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.btn-add-user{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
  border:none;padding:10px 20px;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;
}
.btn-add-user:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,142,247,.4);}
.user-row{
  display:flex;align-items:center;gap:14px;padding:14px;
  background:var(--bg-3);border:1px solid var(--border);
  border-radius:12px;margin-bottom:10px;transition:.2s;
}
.user-row:hover{border-color:var(--primary);}
.user-avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--success));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:18px;
}
.user-info-cell{flex:1;min-width:0;}
.user-name{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.me-tag{font-size:10px;padding:2px 8px;background:var(--bg-4);border-radius:8px;color:var(--text-2);font-weight:600;}
.user-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text-2);align-items:center;}
.role-badge{padding:2px 10px;border-radius:10px;font-weight:700;}
.role-badge.admin{background:rgba(245,158,11,.15);color:var(--accent);}
.role-badge.user{background:rgba(79,142,247,.15);color:var(--primary);}
.status-badge{padding:2px 10px;border-radius:10px;font-weight:700;}
.status-badge.active{background:rgba(34,197,94,.15);color:var(--success);}
.status-badge.inactive{background:rgba(100,116,139,.15);color:var(--text-3);}
.user-actions{display:flex;gap:6px;flex-wrap:wrap;}
.btn-sm{
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:600;transition:.2s;
}
.btn-sm:hover{transform:translateY(-1px);}
.btn-sm.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-sm.danger{color:var(--urgent);border-color:rgba(220,38,38,.3);}
.btn-sm.danger:hover{background:var(--urgent);color:#fff;}
.btn-sm.warn{color:var(--important);border-color:rgba(245,158,11,.3);}
.btn-sm.warn:hover{background:var(--important);color:#fff;}
.btn-sm.success{color:var(--success);border-color:rgba(34,197,94,.3);}
.btn-sm.success:hover{background:var(--success);color:#fff;}

.empty{text-align:center;padding:40px;color:var(--text-2);}
#modalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;
}
#modalOverlay.active{display:flex;}
.modal-box{
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:20px;max-width:650px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:slideUp .3s;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:relative;}
.modal-header::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;}
.modal-header.normal::before{background:var(--success);}
.modal-header.important::before{background:var(--important);}
.modal-header.urgent::before{background:var(--urgent);}
.modal-badges{display:flex;gap:8px;}
.priority-badge,.status-badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.priority-badge.urgent{background:rgba(255,77,79,.15);color:var(--urgent);border:1px solid rgba(255,77,79,.3);}
.priority-badge.important{background:rgba(245,158,11,.15);color:var(--important);border:1px solid rgba(245,158,11,.3);}
.priority-badge.normal{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);}
.status-badge.new{background:rgba(79,142,247,.15);color:var(--primary);border:1px solid rgba(79,142,247,.3);}
.status-badge.progress{background:rgba(245,158,11,.15);color:var(--important);border:1px solid rgba(245,158,11,.3);}
.status-badge.done{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);}
.modal-close{background:var(--bg-3);color:var(--text);border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;}
.modal-close:hover{background:var(--urgent);color:#fff;}
.modal-title{padding:20px 24px 12px;font-size:22px;font-weight:800;line-height:1.4;}
.modal-tags{padding:0 24px 12px;display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:11px;padding:4px 12px;background:rgba(79,142,247,.15);color:var(--primary);border-radius:12px;font-weight:600;}
.modal-meta{padding:0 24px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.meta-item{background:var(--bg-3);padding:10px 14px;border-radius:10px;display:flex;flex-direction:column;gap:2px;}
.meta-label{font-size:11px;color:var(--text-3);font-weight:600;}
.meta-value{font-size:13px;color:var(--text);font-weight:600;}
.overdue-text{color:var(--urgent);}
.modal-section{padding:16px 24px;border-top:1px solid var(--border);}
.modal-section-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--primary);}
.modal-notes{background:var(--bg-3);padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;color:var(--text-2);}
.modal-comments-list{max-height:220px;overflow-y:auto;margin-bottom:12px;}
.modal-comment{background:var(--bg-3);padding:10px 14px;border-radius:10px;margin-bottom:8px;}
.modal-comment-head{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;}
.modal-comment-author{color:var(--primary);font-weight:700;}
.modal-comment-date{color:var(--text-3);font-size:11px;}
.modal-comment-text{font-size:13px;line-height:1.6;color:var(--text);}
.empty-comments{text-align:center;color:var(--text-3);font-size:13px;padding:20px;}
.modal-comment-form{display:flex;gap:8px;}
.modal-comment-form input{flex:1;padding:10px 14px;background:var(--bg-3);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;}
.modal-comment-form input:focus{outline:none;border-color:var(--primary);}
.modal-comment-form button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
.modal-actions{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--bg-3);flex-wrap:wrap;}
.modal-status-select{padding:10px 14px;background:var(--bg-2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;margin-left:auto;}
.btn-edit,.btn-del,.btn-pin{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg-2);color:var(--text);}
.btn-edit:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-del:hover{background:var(--urgent);color:#fff;border-color:var(--urgent);}
.btn-pin:hover,.btn-pin.active{background:var(--accent);color:#fff;border-color:var(--accent);}

#reportOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:1100;padding:20px;
}
#reportOverlay.active{display:flex;}
.report-wrapper{
  background:var(--bg-2);border-radius:20px;max-width:850px;width:100%;
  max-height:95vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:slideUp .3s;
}
.report-toolbar{
  padding:16px 24px;background:var(--bg-3);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;
}
.report-toolbar-title{font-size:16px;font-weight:700;}
.report-toolbar-actions{display:flex;gap:10px;}
.btn-download{
  background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;
  padding:10px 20px;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:700;font-family:inherit;
}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,.4);}
.btn-download:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-close-report{
  background:var(--bg-2);color:var(--text);border:1px solid var(--border);
  padding:10px 20px;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:600;font-family:inherit;
}
.btn-close-report:hover{background:var(--urgent);color:#fff;border-color:var(--urgent);}
.report-scroll{overflow-y:auto;flex:1;padding:24px;}
.report-content{background:#fff;color:#1a1a1a;padding:40px;border-radius:12px;font-family:'Cairo',sans-serif;direction:rtl;}
.r-header{display:flex;align-items:center;gap:24px;padding-bottom:24px;margin-bottom:28px;border-bottom:3px solid #1e3a8a;position:relative;}
.r-header::after{content:'';position:absolute;bottom:-3px;right:0;width:120px;height:3px;background:linear-gradient(90deg,#22c55e,#4f8ef7);}
.r-logo-wrap{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,rgba(30,58,138,.1),rgba(34,197,94,.1));padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(30,58,138,.2);flex-shrink:0;}
.r-logo{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;padding:10px;}
.r-header-text h1{color:#1e3a8a;font-size:32px;margin-bottom:6px;font-weight:900;}
.r-header-text p{color:#64748b;font-size:14px;}
.r-date{font-weight:700;color:#1e3a8a !important;margin-top:6px;font-size:13px !important;}
.r-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
.r-sum-item{background:#f1f5f9;padding:16px;border-radius:12px;text-align:center;border-right:4px solid #64748b;}
.r-sum-item.done{border-right-color:#22c55e;background:rgba(34,197,94,.08);}
.r-sum-item.progress{border-right-color:#f59e0b;background:rgba(245,158,11,.08);}
.r-sum-item.overdue{border-right-color:#dc2626;background:rgba(220,38,38,.08);}
.r-sum-num{font-size:26px;font-weight:900;margin-bottom:4px;color:#1e3a8a;}
.r-sum-item.done .r-sum-num{color:#16a34a;}
.r-sum-item.progress .r-sum-num{color:#d97706;}
.r-sum-item.overdue .r-sum-num{color:#dc2626;}
.r-sum-label{font-size:12px;color:#64748b;font-weight:600;}
.r-section{margin-bottom:28px;}
.r-section h2{font-size:18px;color:#1e3a8a;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;font-weight:800;}
.r-table{width:100%;border-collapse:collapse;font-size:13px;}
.r-table th{background:#1e3a8a;color:#fff;padding:10px;text-align:right;font-weight:700;}
.r-table th:first-child{border-top-right-radius:8px;}
.r-table th:last-child{border-top-left-radius:8px;}
.r-table td{padding:10px;border-bottom:1px solid #e2e8f0;}
.r-table tbody tr:nth-child(even){background:#f8fafc;}
.r-task{background:#f8fafc;padding:14px;border-radius:10px;margin-bottom:10px;border-right:4px solid #64748b;}
.r-task-head{display:flex;gap:8px;margin-bottom:6px;}
.r-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700;}
.r-urgent{background:#fee2e2;color:#dc2626;}
.r-important{background:#fef3c7;color:#d97706;}
.r-normal{background:#d1fae5;color:#059669;}
.r-status{font-size:11px;padding:3px 10px;border-radius:12px;background:#e0e7ff;color:#3730a3;font-weight:700;}
.r-title{font-size:15px;font-weight:700;margin-bottom:6px;color:#1a1a1a;}
.r-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#64748b;margin-bottom:4px;}
.r-notes{font-size:12px;color:#64748b;margin-top:6px;font-style:italic;}
.r-comments{font-size:12px;color:#2563eb;margin-top:4px;}
.r-footer{margin-top:30px;padding-top:16px;border-top:2px solid #e2e8f0;text-align:center;font-size:12px;color:#94a3b8;}

#toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--bg-3);color:var(--text);
  padding:14px 24px;border-radius:12px;
  font-size:14px;font-weight:700;
  border:1px solid var(--primary);
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;transition:.3s;z-index:9999;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.success{border-color:var(--success);}
#toast.warn{border-color:var(--important);}
#toast.error{border-color:var(--urgent);}

@media (max-width:700px){
  #tasksList{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .header-brand h1{font-size:16px;}
  .header-brand .subtitle{display:none;}
  .header-logo-wrap{width:42px;height:42px;}
  .login-logo-wrap{width:100px;height:100px;}
  .login-card h1{font-size:24px;}
  .team-row{grid-template-columns:1fr;gap:6px;}
  .user-info{gap:6px;font-size:11px;}
  .role{padding:3px 8px;font-size:10px;}
  .modal-meta{grid-template-columns:1fr;}
  .modal-actions{flex-wrap:wrap;}
  .modal-status-select{margin-left:0;width:100%;}
  .r-summary{grid-template-columns:1fr 1fr;}
  .report-content{padding:20px;}
  .r-header{flex-direction:column;text-align:center;gap:14px;}
  .r-logo-wrap{width:80px;height:80px;}
  .r-header-text h1{font-size:24px;}
  .r-header::after{right:50%;transform:translateX(-50%);}
  .user-row{flex-direction:column;text-align:center;}
  .user-actions{justify-content:center;}
  .main-nav{padding:8px 12px;}
}
</style>
</head>
<body>

<!-- ==================== شاشة الدخول ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="login-logo" alt="EMAK">
    </div>
    <h1>EMAK Hub</h1>
    <p>نظام إدارة المهام — قسم نظم المعلومات</p>

    <form id="loginForm">
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input id="loginUsername" type="text" placeholder="اسم المستخدم" autocomplete="username" required>
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" onclick="window.togglePassword()">👁️</button>
      </div>
      <label class="remember-me">
        <input type="checkbox" id="rememberMe"> تذكرني على هذا الجهاز
      </label>
      <button type="submit" id="loginSubmitBtn">تسجيل الدخول</button>
      <div id="loginError"></div>
    </form>

    <div class="divider"><span>أو</span></div>

    <button id="loginBtn" type="button">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      الدخول بحساب جوجل
    </button>

    <p class="help-text">نسيت كلمة المرور؟ تواصل مع المدير</p>
  </div>
</div>

<!-- ==================== شاشة التحميل ==================== -->
<div id="loadingScreen">
  <div class="loading-logo-wrap">
    <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="loading-logo" alt="EMAK">
  </div>
  <div class="loading-text">جارٍ التحميل...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- ==================== الشاشة الرئيسية ==================== -->
<div id="mainScreen">
  <header>
    <div class="header-brand">
      <div class="header-logo-wrap">
        <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="header-logo" alt="EMAK">
      </div>
      <div>
        <h1>EMAK Hub</h1>
        <div class="subtitle">نظم معلومات إيماك</div>
      </div>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button class="user-menu-btn" onclick="window.openChangePasswordModal()" title="تغيير كلمة المرور">🔑 كلمة المرور</button>
      <button class="btn-report" onclick="window.openReport()">📄 تقرير PDF</button>
      <button id="themeBtn" class="icon-btn" title="تبديل الوضع">☀️</button>
      <button id="logoutBtn">خروج</button>
    </div>
  </header>

  <!-- التنقل الرئيسي -->
  <nav class="main-nav">
    <button class="nav-btn active" data-view="dashboard">🏠 الرئيسية</button>
    <button class="nav-btn" data-view="tasks">📋 المهام</button>
    <button class="nav-btn" id="usersNavBtn" data-view="users" style="display:none;">👥 المستخدمون</button>
    <button class="nav-btn" id="teamNavBtn" onclick="window.openTeamModal()" style="display:none;">🔧 الفريق</button>
    <button class="nav-btn" onclick="window.exportCSV()">📊 Excel</button>
  </nav>

  <!-- ===== قسم: الرئيسية ===== -->
  <div class="view-section active" id="dashboardView">
    <div class="container">
      <div class="card-panel">
        <div class="panel-title">📊 نظرة عامة</div>
        <div class="stats-grid">
          <div class="stat total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">إجمالي المهام</div></div>
          <div class="stat done"><div class="stat-num" id="statDone">0</div><div class="stat-label">مكتملة</div></div>
          <div class="stat progress"><div class="stat-num" id="statProgress">0</div><div class="stat-label">جارية</div></div>
          <div class="stat overdue"><div class="stat-num" id="statOverdue">0</div><div class="stat-label">متأخرة</div></div>
        </div>
      </div>

      <div class="card-panel">
        <div class="panel-title">📈 تحليل الإنتاجية</div>
        <div class="charts-grid">
          <div class="chart-box"><canvas id="chartStatus"></canvas></div>
          <div class="chart-box"><canvas id="chartProductivity"></canvas></div>
        </div>
      </div>

      <div class="card-panel">
        <div class="panel-title">👥 أداء الفريق</div>
        <div id="teamList"></div>
      </div>
    </div>
  </div>

  <!-- ===== قسم: المهام ===== -->
  <div class="view-section" id="tasksView">
    <div class="container">
      <div class="card-panel" id="addTaskCard" style="display:none;">
        <div class="panel-title">➕ إضافة مهمة جديدة</div>
        <form id="addTaskForm" class="form-grid">
          <input id="taskTitle" type="text" placeholder="عنوان المهمة *" required>
          <select id="taskAssignee" required>
            <option value="">-- المسؤول --</option>
          </select>
          <select id="taskPriority" required>
            <option value="عادي">🟢 عادي</option>
            <option value="مهم">🟡 مهم</option>
            <option value="عاجل">🔴 عاجل</option>
          </select>
          <input id="taskDue" type="date" title="تاريخ التسليم">
          <input id="taskNotes" type="text" placeholder="ملاحظات (اختياري)">
          <input id="taskTags" type="text" placeholder="وسوم (فاصلة: شبكات, صيانة)">
          <button type="submit">إضافة المهمة</button>
        </form>
      </div>

      <div class="controls-bar">
        <div class="search-wrap">
          <input id="searchBox" type="text" placeholder="ابحث في المهام...">
        </div>
        <select id="sortSelect">
          <option value="priority">ترتيب: الأولوية</option>
          <option value="date">ترتيب: الأحدث</option>
          <option value="due">ترتيب: تاريخ التسليم</option>
          <option value="title">ترتيب: أبجدي</option>
        </select>
        <div class="view-toggle">
          <button class="active" data-view="grid">▦ شبكة</button>
          <button data-view="kanban">▤ كانبان</button>
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="mine">مهامي</button>
        <button class="filter-btn" data-filter="pending">معلقة</button>
        <button class="filter-btn" data-filter="overdue">متأخرة</button>
        <button class="filter-btn" data-filter="done">مكتملة</button>
        <button class="filter-btn" data-filter="week">هذا الأسبوع</button>
        <button class="filter-btn" data-filter="month">هذا الشهر</button>
      </div>

      <div id="tasksList"></div>
    </div>
  </div>

  <!-- ===== قسم: المستخدمون ===== -->
  <div class="view-section" id="usersView">
    <div class="container">
      <div class="card-panel">
        <div class="users-toolbar">
          <div class="panel-title" style="margin:0;">👥 إدارة المستخدمين</div>
          <button class="btn-add-user" onclick="window.openAddUserModal()">➕ إضافة مستخدم</button>
        </div>
        <div id="usersList"></div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== المودال ==================== -->
<div id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div id="modalBody"></div>
  </div>
</div>

<!-- ==================== التقرير ==================== -->
<div id="reportOverlay">
  <div class="report-wrapper">
    <div class="report-toolbar">
      <div class="report-toolbar-title">📄 معاينة التقرير</div>
      <div class="report-toolbar-actions">
        <button class="btn-download" id="downloadPdfBtn" onclick="window.downloadPDF()">📄 تحميل PDF</button>
        <button class="btn-close-report" onclick="window.closeReport()">إغلاق</button>
      </div>
    </div>
    <div class="report-scroll">
      <div id="reportBody"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
