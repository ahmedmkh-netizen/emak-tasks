<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMAK Hub - إدارة المهام</title>
<link rel="icon" href="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, update, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBagaYYgtQgAGyntE1go9IsGy7T85cvuSY",
  authDomain: "emak-tasks.firebaseapp.com",
  databaseURL: "https://emak-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emak-tasks",
  storageBucket: "emak-tasks.firebasestorage.app",
  messagingSenderId: "752119205815",
  appId: "1:752119205815:web:a96725f43555fb0c742232"
};

const ADMIN_EMAILS = ["ahmedmkh@gmail.com"];
const LOGO_URL = "https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let isAdmin = false;
let allTasks = {};
let currentFilter = "all";
let currentSearch = "";
let currentSort = "priority";
let currentTheme = localStorage.getItem("theme") || "dark";
let openTaskId = null;
let pinnedTaskId = localStorage.getItem("pinnedTask") || null;
let charts = {};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}
function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" });
}
function formatDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleString("ar-EG", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function daysRemaining(dueDate) {
  if (!dueDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate); due.setHours(0,0,0,0);
  return Math.round((due - today) / (1000 * 60 * 60 * 24));
}
function dueLabel(dueDate) {
  const d = daysRemaining(dueDate);
  if (d === null) return "";
  if (d < 0) return `⚠️ متأخر ${Math.abs(d)} يوم`;
  if (d === 0) return `🔥 يستحق اليوم`;
  if (d === 1) return `📅 غداً`;
  if (d <= 3) return `📅 باقي ${d} أيام`;
  return `📅 ${dueDate}`;
}
function isThisWeek(ts) {
  if (!ts) return false;
  return (Date.now() - ts) <= 7 * 24 * 60 * 60 * 1000;
}
function isThisMonth(ts) {
  if (!ts) return false;
  return (Date.now() - ts) <= 30 * 24 * 60 * 60 * 1000;
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", currentTheme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = currentTheme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", currentTheme);
}

document.getElementById("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) { alert("فشل تسجيل الدخول: " + e.message); }
};
document.getElementById("logoutBtn").onclick = () => {
  if (confirm("متأكد إنك عايز تخرج؟")) signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  const loginScreen = document.getElementById("loginScreen");
  const mainScreen = document.getElementById("mainScreen");
  const loadingScreen = document.getElementById("loadingScreen");
  if (user) {
    currentUser = user;
    isAdmin = ADMIN_EMAILS.includes(user.email);
    // شاشة التحميل
    loadingScreen.style.display = "flex";
    loginScreen.style.display = "none";
    setTimeout(() => {
      loadingScreen.style.display = "none";
      mainScreen.style.display = "block";
      document.getElementById("userName").textContent = user.displayName || user.email;
      document.getElementById("userRole").textContent = isAdmin ? "👑 مدير" : "👤 موظف";
      document.getElementById("userRole").className = isAdmin ? "role admin" : "role user";
      document.getElementById("addTaskCard").style.display = isAdmin ? "block" : "none";
      set(ref(db, "users/" + user.uid), {
        name: user.displayName || "",
        email: user.email || "",
        lastLogin: serverTimestamp(),
        isAdmin: isAdmin
      });
      loadTasks();
    }, 1200);
  } else {
    currentUser = null;
    isAdmin = false;
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
    loadingScreen.style.display = "none";
  }
});

function loadTasks() {
  onValue(ref(db, "tasks"), (snap) => {
    allTasks = snap.val() || {};
    renderAll();
    if (openTaskId && allTasks[openTaskId]) renderModal(openTaskId);
  });
}

document.getElementById("addTaskForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!isAdmin) return alert("غير مصرح");
  const title = document.getElementById("taskTitle").value.trim();
  const assignee = document.getElementById("taskAssignee").value;
  const priority = document.getElementById("taskPriority").value;
  const dueDate = document.getElementById("taskDue").value;
  const notes = document.getElementById("taskNotes").value.trim();
  const tags = document.getElementById("taskTags").value.trim();
  if (!title || !assignee) return;

  await push(ref(db, "tasks"), {
    title, assignee, priority, dueDate, notes, tags,
    status: "جديدة",
    createdBy: currentUser.email,
    createdByName: currentUser.displayName || currentUser.email.split("@")[0],
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
  e.target.reset();
  showToast("✅ تمت إضافة المهمة");
};

async function changeStatus(taskId, newStatus) {
  const t = allTasks[taskId];
  if (!t) return;
  await update(ref(db, "tasks/" + taskId), {
    status: newStatus,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast(`🔄 الحالة: ${newStatus}`);
}

async function addComment(taskId, fromModal = false) {
  const inputId = fromModal ? "modal-comment-input" : "comment-" + taskId;
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if (!text) return;
  const commentRef = push(ref(db, "tasks/" + taskId + "/comments"));
  await set(commentRef, {
    text,
    author: currentUser.displayName || currentUser.email.split("@")[0],
    authorEmail: currentUser.email,
    createdAt: serverTimestamp()
  });
  await update(ref(db, "tasks/" + taskId), {
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  input.value = "";
  showToast("💬 تمت الإضافة");
}

async function deleteTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  if (confirm("متأكد من حذف المهمة؟ لا يمكن التراجع!")) {
    await remove(ref(db, "tasks/" + taskId));
    closeModal();
    showToast("🗑️ تم الحذف");
  }
}

async function editTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  const t = allTasks[taskId];
  if (!t) return;
  const newTitle = prompt("العنوان:", t.title);
  if (newTitle === null) return;
  const newDue = prompt("التسليم (YYYY-MM-DD):", t.dueDate || "");
  if (newDue === null) return;
  const newPriority = prompt("الأولوية (عاجل/مهم/عادي):", t.priority || "عادي");
  if (newPriority === null) return;
  const newAssignee = prompt("المسؤول (بهاء/محمود):", t.assignee);
  if (newAssignee === null) return;
  const newTags = prompt("الوسوم (فاصلة):", t.tags || "");
  if (newTags === null) return;

  await update(ref(db, "tasks/" + taskId), {
    title: newTitle.trim() || t.title,
    dueDate: newDue.trim(),
    priority: newPriority.trim() || "عادي",
    assignee: newAssignee.trim() || t.assignee,
    tags: newTags.trim(),
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast("✏️ تم التعديل");
}

function togglePin(taskId) {
  if (pinnedTaskId === taskId) {
    pinnedTaskId = null;
    localStorage.removeItem("pinnedTask");
    showToast("📌 تم إلغاء التثبيت");
  } else {
    pinnedTaskId = taskId;
    localStorage.setItem("pinnedTask", taskId);
    showToast("⭐ تم التثبيت");
  }
  renderTasks();
}

function openModal(taskId) {
  openTaskId = taskId;
  renderModal(taskId);
  document.getElementById("modalOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  openTaskId = null;
  document.getElementById("modalOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

function renderModal(taskId) {
  const t = allTasks[taskId];
  if (!t) return closeModal();
  const statusClass = t.status === "مكتملة" ? "done"
    : t.status === "جاري التنفيذ" ? "progress" : "new";
  const priorityClass = t.priority === "عاجل" ? "urgent"
    : t.priority === "مهم" ? "important" : "normal";
  const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
  const d = daysRemaining(t.dueDate);
  const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";

  const comments = t.comments ? Object.entries(t.comments).sort((a,b) =>
    (a[1].createdAt || 0) - (b[1].createdAt || 0)
  ) : [];

  const commentsHtml = comments.length > 0 ? comments.map(([cid, c]) => `
    <div class="modal-comment">
      <div class="modal-comment-head">
        <span class="modal-comment-author">${escapeHtml(c.author)}</span>
        <span class="modal-comment-date">${formatDateTime(c.createdAt)}</span>
      </div>
      <div class="modal-comment-text">${escapeHtml(c.text)}</div>
    </div>
  `).join("") : '<p class="empty-comments">لا توجد تعليقات بعد</p>';

  const tagsHtml = t.tags ? t.tags.split(",").map(tag => tag.trim()).filter(Boolean).map(tag =>
    `<span class="tag">${escapeHtml(tag)}</span>`
  ).join("") : "";

  document.getElementById("modalBody").innerHTML = `
    <div class="modal-header ${priorityClass}">
      <div class="modal-badges">
        <span class="priority-badge ${priorityClass}">${
          t.priority === "عاجل" ? "🔴 عاجل" :
          t.priority === "مهم" ? "🟡 مهم" : "🟢 عادي"
        }</span>
        <span class="status-badge ${statusClass}">${t.status}</span>
      </div>
      <button class="modal-close" onclick="window.closeModal()">✕</button>
    </div>
    <h2 class="modal-title">${escapeHtml(t.title)}</h2>
    ${tagsHtml ? `<div class="modal-tags">${tagsHtml}</div>` : ""}
    <div class="modal-meta">
      <div class="meta-item">
        <span class="meta-label">👤 المسؤول</span>
        <span class="meta-value">${escapeHtml(t.assignee)}</span>
      </div>
      ${t.dueDate ? `<div class="meta-item">
        <span class="meta-label">📅 التسليم</span>
        <span class="meta-value ${isOverdue ? 'overdue-text' : ''}">${dueLabel(t.dueDate)}</span>
      </div>` : ""}
      <div class="meta-item">
        <span class="meta-label">✏️ آخر تعديل</span>
        <span class="meta-value">${t.updatedByName ? escapeHtml(t.updatedByName) + " — " + formatDate(t.updatedAt) : "—"}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">🆕 أُنشئت</span>
        <span class="meta-value">${formatDate(t.createdAt)}</span>
      </div>
    </div>
    ${t.notes ? `<div class="modal-section">
      <div class="modal-section-title">📝 ملاحظات المهمة</div>
      <div class="modal-notes">${escapeHtml(t.notes)}</div>
    </div>` : ""}
    <div class="modal-section">
      <div class="modal-section-title">💬 التعليقات (${comments.length})</div>
      <div class="modal-comments-list">${commentsHtml}</div>
      <div class="modal-comment-form">
        <input id="modal-comment-input" type="text" placeholder="أضف تعليقاً...">
        <button onclick="window.addComment('${taskId}', true)">إرسال</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-pin ${pinnedTaskId === taskId ? 'active' : ''}" onclick="window.togglePin('${taskId}')">${pinnedTaskId === taskId ? '⭐ مثبتة' : '☆ تثبيت'}</button>
      <select onchange="window.changeStatus('${taskId}', this.value)" class="modal-status-select">
        <option ${t.status === "جديدة" ? "selected" : ""}>جديدة</option>
        <option ${t.status === "جاري التنفيذ" ? "selected" : ""}>جاري التنفيذ</option>
        <option ${t.status === "مكتملة" ? "selected" : ""}>مكتملة</option>
      </select>
      ${isAdmin ? `
        <button class="btn-edit" onclick="window.editTask('${taskId}')">✏️ تعديل</button>
        <button class="btn-del" onclick="window.deleteTask('${taskId}')">🗑️ حذف</button>
      ` : ""}
    </div>
  `;
  document.getElementById("modalBox").className = "modal-box" + (isUrgent ? " urgent-glow" : "");
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderAll();
  };
});
document.getElementById("searchBox").addEventListener("input", (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  renderTasks();
});
document.getElementById("sortSelect").addEventListener("change", (e) => {
  currentSort = e.target.value;
  renderTasks();
});
document.getElementById("themeBtn").onclick = () => {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  applyTheme();
};

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function renderAll() {
  renderStats();
  renderTeam();
  renderTasks();
  renderCharts();
}

function renderStats() {
  const entries = Object.entries(allTasks);
  const total = entries.length;
  const done = entries.filter(([_, t]) => t.status === "مكتملة").length;
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ").length;
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  }).length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statDone").textContent = done;
  document.getElementById("statProgress").textContent = progress;
  document.getElementById("statOverdue").textContent = overdue;
}

function renderTeam() {
  const team = {};
  Object.values(allTasks).forEach(t => {
    if (!team[t.assignee]) team[t.assignee] = { total: 0, done: 0 };
    team[t.assignee].total++;
    if (t.status === "مكتملة") team[t.assignee].done++;
  });
  const html = Object.entries(team).map(([name, s]) => {
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return `<div class="team-row">
      <div class="team-name">${escapeHtml(name)}</div>
      <div class="team-bar"><div class="team-fill" style="width:${pct}%"></div></div>
      <div class="team-pct">${pct}% (${s.done}/${s.total})</div>
    </div>`;
  }).join("");
  document.getElementById("teamList").innerHTML = html || '<p class="empty">لا توجد بيانات</p>';
}

function renderCharts() {
  const entries = Object.values(allTasks);
  const done = entries.filter(t => t.status === "مكتملة").length;
  const progress = entries.filter(t => t.status === "جاري التنفيذ").length;
  const newT = entries.filter(t => t.status === "جديدة").length;

  const ctx1 = document.getElementById("chartStatus");
  if (ctx1) {
    if (charts.status) charts.status.destroy();
    charts.status = new Chart(ctx1, {
      type: "doughnut",
      data: {
        labels: ["مكتملة", "جارية", "جديدة"],
        datasets: [{
          data: [done, progress, newT],
          backgroundColor: ["#22c55e", "#f59e0b", "#4f8ef7"],
          borderColor: "transparent", borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "bottom",
            labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text').trim(), font: { family: "Cairo", size: 12 } }
          }
        }
      }
    });
  }

  const ctx2 = document.getElementById("chartProductivity");
  if (ctx2) {
    const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const counts = [0,0,0,0,0,0,0];
    entries.filter(t => t.status === "مكتملة" && isThisWeek(t.updatedAt)).forEach(t => {
      const d = new Date(t.updatedAt).getDay();
      counts[d]++;
    });
    const reordered = [counts[6], counts[0], counts[1], counts[2], counts[3], counts[4], counts[5]];

    if (charts.productivity) charts.productivity.destroy();
    charts.productivity = new Chart(ctx2, {
      type: "bar",
      data: {
        labels: days,
        datasets: [{
          label: "مهام مكتملة هذا الأسبوع",
          data: reordered,
          backgroundColor: "#4f8ef7",
          borderRadius: 8, borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim(), stepSize: 1, font: { family: "Cairo" } },
            grid: { color: "rgba(128,128,128,0.1)" }
          },
          x: {
            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-2').trim(), font: { family: "Cairo" } },
            grid: { display: false }
          }
        }
      }
    });
  }
}

function renderTasks() {
  const list = document.getElementById("tasksList");
  let entries = Object.entries(allTasks);

  entries.sort((a, b) => {
    if (a[0] === pinnedTaskId) return -1;
    if (b[0] === pinnedTaskId) return 1;

    if (currentSort === "priority") {
      const pri = { "عاجل": 0, "مهم": 1, "عادي": 2 };
      const pa = pri[a[1].priority] ?? 2;
      const pb = pri[b[1].priority] ?? 2;
      if (pa !== pb) return pa - pb;
      return (b[1].createdAt || 0) - (a[1].createdAt || 0);
    }
    if (currentSort === "date") return (b[1].createdAt || 0) - (a[1].createdAt || 0);
    if (currentSort === "due") {
      if (!a[1].dueDate) return 1;
      if (!b[1].dueDate) return -1;
      return new Date(a[1].dueDate) - new Date(b[1].dueDate);
    }
    if (currentSort === "title") return (a[1].title || "").localeCompare(b[1].title || "", "ar");
    return 0;
  });

  let filtered = entries.filter(([_, t]) => {
    if (currentFilter === "all") return true;
    if (currentFilter === "بهاء") return t.assignee === "بهاء";
    if (currentFilter === "محمود") return t.assignee === "محمود";
    if (currentFilter === "pending") return t.status !== "مكتملة";
    if (currentFilter === "done") return t.status === "مكتملة";
    if (currentFilter === "overdue") {
      const d = daysRemaining(t.dueDate);
      return d !== null && d < 0 && t.status !== "مكتملة";
    }
    if (currentFilter === "week") return isThisWeek(t.createdAt);
    if (currentFilter === "month") return isThisMonth(t.createdAt);
    return true;
  });

  if (currentSearch) {
    filtered = filtered.filter(([_, t]) => {
      const haystack = `${t.title} ${t.notes || ""} ${t.assignee} ${t.status} ${t.priority || ""} ${t.tags || ""}`.toLowerCase();
      return haystack.includes(currentSearch);
    });
  }

  if (filtered.length === 0) {
    list.innerHTML = '<p class="empty" style="grid-column:1/-1;">لا توجد مهام مطابقة</p>';
    return;
  }

  list.innerHTML = filtered.map(([id, t]) => {
    const statusClass = t.status === "مكتملة" ? "done"
      : t.status === "جاري التنفيذ" ? "progress" : "new";
    const priorityClass = t.priority === "عاجل" ? "urgent"
      : t.priority === "مهم" ? "important" : "normal";
    const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
    const d = daysRemaining(t.dueDate);
    const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";
    const commentsCount = t.comments ? Object.keys(t.comments).length : 0;
    const isPinned = pinnedTaskId === id;

    const tagsHtml = t.tags ? t.tags.split(",").map(tag => tag.trim()).filter(Boolean).slice(0, 2).map(tag =>
      `<span class="card-tag">${escapeHtml(tag)}</span>`
    ).join("") : "";

    return `
      <div class="task-card ${priorityClass} ${statusClass} ${isUrgent ? "urgent-glow" : ""} ${isPinned ? "pinned" : ""}" onclick="window.openModal('${id}')">
        ${isPinned ? '<div class="pin-badge">⭐</div>' : ""}
        <div class="card-top">
          <span class="priority-dot ${priorityClass}"></span>
          <span class="assignee-chip">👤 ${escapeHtml(t.assignee)}</span>
        </div>
        <h3 class="card-title">${escapeHtml(t.title)}</h3>
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
        ${t.notes ? `<p class="card-notes">${escapeHtml(t.notes)}</p>` : ""}
        <div class="card-bottom">
          ${t.dueDate ? `<span class="card-due ${isOverdue ? 'overdue' : ''}">${dueLabel(t.dueDate)}</span>` : "<span></span>"}
          <div class="card-icons">
            ${commentsCount > 0 ? `<span class="card-icon">💬 ${commentsCount}</span>` : ""}
            <span class="status-pill ${statusClass}">${t.status}</span>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function openReport() {
  const entries = Object.entries(allTasks);
  const done = entries.filter(([_, t]) => t.status === "مكتملة");
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ");
  const newT = entries.filter(([_, t]) => t.status === "جديدة");
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  });

  const team = {};
  entries.forEach(([_, t]) => {
    if (!team[t.assignee]) team[t.assignee] = { total: 0, done: 0, progress: 0, overdue: 0 };
    team[t.assignee].total++;
    if (t.status === "مكتملة") team[t.assignee].done++;
    else if (t.status === "جاري التنفيذ") team[t.assignee].progress++;
    const d = daysRemaining(t.dueDate);
    if (d !== null && d < 0 && t.status !== "مكتملة") team[t.assignee].overdue++;
  });

  const teamRows = Object.entries(team).map(([name, s]) => `
    <tr>
      <td>${escapeHtml(name)}</td>
      <td>${s.total}</td>
      <td>${s.done}</td>
      <td>${s.progress}</td>
      <td>${s.overdue}</td>
      <td>${s.total ? Math.round((s.done/s.total)*100) : 0}%</td>
    </tr>
  `).join("");

  const taskRow = (id, t) => `
    <div class="r-task">
      <div class="r-task-head">
        <span class="r-badge ${t.priority === 'عاجل' ? 'r-urgent' : t.priority === 'مهم' ? 'r-important' : 'r-normal'}">${t.priority || 'عادي'}</span>
        <span class="r-status">${t.status}</span>
      </div>
      <div class="r-title">${escapeHtml(t.title)}</div>
      <div class="r-meta">
        <span>👤 ${escapeHtml(t.assignee)}</span>
        ${t.dueDate ? `<span>📅 ${t.dueDate}</span>` : ""}
        ${t.updatedByName ? `<span>✏️ آخر تعديل: ${escapeHtml(t.updatedByName)}</span>` : ""}
      </div>
      ${t.notes ? `<div class="r-notes">📝 ${escapeHtml(t.notes)}</div>` : ""}
      ${t.comments ? `<div class="r-comments">💬 ${Object.keys(t.comments).length} تعليق</div>` : ""}
    </div>
  `;

  const today = new Date().toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });

  const reportHtml = `
    <div id="reportContent" class="report-content">
      <div class="r-header">
        <div class="r-logo-wrap">
          <img src="${LOGO_URL}" class="r-logo" crossorigin="anonymous">
        </div>
        <div class="r-header-text">
          <h1>EMAK Hub</h1>
          <p>تقرير المهام — قسم نظم المعلومات</p>
          <p class="r-date">التاريخ: ${today}</p>
        </div>
      </div>

      <div class="r-summary">
        <div class="r-sum-item"><div class="r-sum-num">${entries.length}</div><div class="r-sum-label">إجمالي</div></div>
        <div class="r-sum-item done"><div class="r-sum-num">${done.length}</div><div class="r-sum-label">مكتملة</div></div>
        <div class="r-sum-item progress"><div class="r-sum-num">${progress.length}</div><div class="r-sum-label">جارية</div></div>
        <div class="r-sum-item overdue"><div class="r-sum-num">${overdue.length}</div><div class="r-sum-label">متأخرة</div></div>
      </div>

      <div class="r-section">
        <h2>👥 أداء الفريق</h2>
        <table class="r-table">
          <thead>
            <tr>
              <th>الموظف</th><th>الإجمالي</th><th>مكتملة</th><th>جارية</th><th>متأخرة</th><th>النسبة</th>
            </tr>
          </thead>
          <tbody>${teamRows}</tbody>
        </table>
      </div>

      ${overdue.length > 0 ? `<div class="r-section"><h2>⚠️ المهام المتأخرة (${overdue.length})</h2>${overdue.map(([id,t]) => taskRow(id,t)).join("")}</div>` : ""}
      ${progress.length > 0 ? `<div class="r-section"><h2>⏳ المهام الجارية (${progress.length})</h2>${progress.map(([id,t]) => taskRow(id,t)).join("")}</div>` : ""}
      ${newT.length > 0 ? `<div class="r-section"><h2>🆕 المهام الجديدة (${newT.length})</h2>${newT.map(([id,t]) => taskRow(id,t)).join("")}</div>` : ""}
      ${done.length > 0 ? `<div class="r-section"><h2>✅ المهام المكتملة (${done.length})</h2>${done.map(([id,t]) => taskRow(id,t)).join("")}</div>` : ""}

      <div class="r-footer">
        تم إنشاء التقرير تلقائياً بواسطة EMAK Hub — ${today}
      </div>
    </div>
  `;

  document.getElementById("reportBody").innerHTML = reportHtml;
  document.getElementById("reportOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeReport() {
  document.getElementById("reportOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

async function downloadPDF() {
  const btn = document.getElementById("downloadPdfBtn");
  btn.disabled = true;
  btn.textContent = "⏳ جاري التحميل...";
  try {
    const element = document.getElementById("reportContent");
    const opt = {
      margin: [10, 10, 10, 10],
      filename: `EMAK-Report-${new Date().toISOString().slice(0,10)}.pdf`,
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
    };
    await html2pdf().set(opt).from(element).save();
    showToast("📄 تم تحميل التقرير");
  } catch (e) {
    alert("خطأ في التحميل: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "📄 تحميل PDF";
  }
}

window.changeStatus = changeStatus;
window.addComment = addComment;
window.deleteTask = deleteTask;
window.editTask = editTask;
window.openModal = openModal;
window.closeModal = closeModal;
window.togglePin = togglePin;
window.openReport = openReport;
window.closeReport = closeReport;
window.downloadPDF = downloadPDF;

document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.getElementById("reportOverlay").addEventListener("click", (e) => {
  if (e.target.id === "reportOverlay") closeReport();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeReport(); }
});

applyTheme();
</script>

<style>

.assignee-chip { font-size: 11px; padding: 4px 10px; background: var(--bg-3); border-radius: 12px; color: var(--text-2); font-weight: 600; }

.card-title {
  font-size: 15px; font-weight: 700; line-height: 1.4;
  color: var(--text); margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 42px;
}
.card-notes {
  font-size: 12px; color: var(--text-2); line-height: 1.5; margin-bottom: 10px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-tags { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.card-tag {
  font-size: 10px; padding: 3px 8px;
  background: rgba(79,142,247,0.15); color: var(--primary);
  border-radius: 10px; font-weight: 600;
}
.card-bottom {
  margin-top: auto; display: flex; justify-content: space-between;
  align-items: center; gap: 8px; flex-wrap: wrap;
}
.card-due { font-size: 11px; color: var(--text-2); padding: 4px 8px; background: var(--bg-3); border-radius: 6px; font-weight: 600; }
.card-due.overdue { background: rgba(255,77,79,0.15); color: var(--urgent); }
.card-icons { display: flex; gap: 6px; align-items: center; }
.card-icon { font-size: 11px; color: var(--text-2); }
.status-pill { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 12px; }
.status-pill.new { background: rgba(79,142,247,0.15); color: var(--primary); }
.status-pill.progress { background: rgba(245,158,11,0.15); color: var(--important); }
.status-pill.done { background: rgba(34,197,94,0.15); color: var(--success); }

.empty { text-align: center; padding: 40px; color: var(--text-2); }

#modalOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
#modalOverlay.active { display: flex; }
.modal-box {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 20px; max-width: 650px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.3s;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-header {
  padding: 20px 24px; display: flex; justify-content: space-between;
  align-items: center; border-bottom: 1px solid var(--border); position: relative;
}
.modal-header::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 4px; }
.modal-header.normal::before { background: var(--success); }
.modal-header.important::before { background: var(--important); }
.modal-header.urgent::before { background: var(--urgent); }
.modal-badges { display: flex; gap: 8px; }
.priority-badge, .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.priority-badge.urgent { background: rgba(255,77,79,0.15); color: var(--urgent); border: 1px solid rgba(255,77,79,0.3); }
.priority-badge.important { background: rgba(245,158,11,0.15); color: var(--important); border: 1px solid rgba(245,158,11,0.3); }
.priority-badge.normal { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
.status-badge.new { background: rgba(79,142,247,0.15); color: var(--primary); border: 1px solid rgba(79,142,247,0.3); }
.status-badge.progress { background: rgba(245,158,11,0.15); color: var(--important); border: 1px solid rgba(245,158,11,0.3); }
.status-badge.done { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
.modal-close {
  background: var(--bg-3); color: var(--text); border: none;
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  font-size: 16px;
}
.modal-close:hover { background: var(--urgent); color: white; }
.modal-title { padding: 20px 24px 12px; font-size: 22px; font-weight: 800; line-height: 1.4; }
.modal-tags { padding: 0 24px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 4px 12px;
  background: rgba(79,142,247,0.15); color: var(--primary);
  border-radius: 12px; font-weight: 600;
}
.modal-meta { padding: 0 24px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meta-item { background: var(--bg-3); padding: 10px 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 11px; color: var(--text-3); font-weight: 600; }
.meta-value { font-size: 13px; color: var(--text); font-weight: 600; }
.overdue-text { color: var(--urgent); }
.modal-section { padding: 16px 24px; border-top: 1px solid var(--border); }
.modal-section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--primary); }
.modal-notes { background: var(--bg-3); padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.7; color: var(--text-2); }
.modal-comments-list { max-height: 220px; overflow-y: auto; margin-bottom: 12px; }
.modal-comment { background: var(--bg-3); padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; }
.modal-comment-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
.modal-comment-author { color: var(--primary); font-weight: 700; }
.modal-comment-date { color: var(--text-3); font-size: 11px; }
.modal-comment-text { font-size: 13px; line-height: 1.6; color: var(--text); }
.empty-comments { text-align: center; color: var(--text-3); font-size: 13px; padding: 20px; }
.modal-comment-form { display: flex; gap: 8px; }
.modal-comment-form input {
  flex: 1; padding: 10px 14px; background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit;
}
.modal-comment-form input:focus { outline: none; border-color: var(--primary); }
.modal-comment-form button {
  padding: 10px 20px; background: var(--primary); color: white;
  border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit;
}
.modal-actions {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  background: var(--bg-3);
}
.modal-status-select {
  padding: 10px 14px; background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; cursor: pointer; margin-left: auto;
}
.btn-edit, .btn-del, .btn-pin {
  padding: 10px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; border: 1px solid var(--border);
  background: var(--bg-2); color: var(--text);
}
.btn-edit:hover { background: var(--primary); color: white; border-color: var(--primary); }
.btn-del:hover { background: var(--urgent); color: white; border-color: var(--urgent); }
.btn-pin:hover { background: var(--accent); color: white; border-color: var(--accent); }
.btn-pin.active { background: var(--accent); color: white; border-color: var(--accent); }

#reportOverlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  z-index: 1100; padding: 20px;
}
#reportOverlay.active { display: flex; }
.report-wrapper {
  background: var(--bg-2);
  border-radius: 20px; max-width: 850px; width: 100%;
  max-height: 95vh; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: slideUp 0.3s;
}
.report-toolbar {
  padding: 16px 24px;
  background: var(--bg-3);
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.report-toolbar-title { font-size: 16px; font-weight: 700; }
.report-toolbar-actions { display: flex; gap: 10px; }
.btn-download {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white; border: none;
  padding: 10px 20px; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 700; font-family: inherit;
}
.btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34,197,94,0.4); }
.btn-download:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-close-report {
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 600; font-family: inherit;
}
.btn-close-report:hover { background: var(--urgent); color: white; border-color: var(--urgent); }
.report-scroll { overflow-y: auto; flex: 1; padding: 24px; }

/* ==== التقرير نفسه ==== */
.report-content {
  background: #ffffff;
  color: #1a1a1a;
  padding: 40px;
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  direction: rtl;
}
/* ✨ اللوجو في التقرير - محسّن ✨ */
.r-header {
  display: flex; align-items: center; gap: 24px;
  padding-bottom: 24px; margin-bottom: 28px;
  border-bottom: 3px solid #1e3a8a;
  position: relative;
}
.r-header::after {
  content: '';
  position: absolute; bottom: -3px; right: 0;
  width: 120px; height: 3px;
  background: linear-gradient(90deg, #22c55e, #4f8ef7);
}
.r-logo-wrap {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(30,58,138,0.1), rgba(34,197,94,0.1));
  padding: 6px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 3px rgba(30,58,138,0.2), 0 0 20px rgba(30,58,138,0.15);
  flex-shrink: 0;
}
.r-logo {
  width: 100%; height: 100%;
  object-fit: contain;
  border-radius: 50%;
  background: #ffffff;
  padding: 10px;
}
.r-header-text h1 {
  color: #1e3a8a; font-size: 32px; margin-bottom: 6px; font-weight: 900;
  letter-spacing: -1px;
}
.r-header-text p { color: #64748b; font-size: 14px; }
.r-date { font-weight: 700; color: #1e3a8a !important; margin-top: 6px; font-size: 13px !important; }

.r-summary {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 28px;
}
.r-sum-item {
  background: #f1f5f9; padding: 16px; border-radius: 12px;
  text-align: center; border-right: 4px solid #64748b;
}
.r-sum-item.done { border-right-color: #22c55e; background: rgba(34,197,94,0.08); }
.r-sum-item.progress { border-right-color: #f59e0b; background: rgba(245,158,11,0.08); }
.r-sum-item.overdue { border-right-color: #dc2626; background: rgba(220,38,38,0.08); }
.r-sum-num { font-size: 26px; font-weight: 900; margin-bottom: 4px; color: #1e3a8a; }
.r-sum-item.done .r-sum-num { color: #16a34a; }
.r-sum-item.progress .r-sum-num { color: #d97706; }
.r-sum-item.overdue .r-sum-num { color: #dc2626; }
.r-sum-label { font-size: 12px; color: #64748b; font-weight: 600; }

.r-section { margin-bottom: 28px; page-break-inside: avoid; }
.r-section h2 {
  font-size: 18px; color: #1e3a8a; margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;
  font-weight: 800;
}
.r-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.r-table th {
  background: #1e3a8a; color: white; padding: 10px;
  text-align: right; font-weight: 700;
}
.r-table th:first-child { border-top-right-radius: 8px; }
.r-table th:last-child { border-top-left-radius: 8px; }
.r-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
.r-table tbody tr:nth-child(even) { background: #f8fafc; }

.r-task {
  background: #f8fafc; padding: 14px; border-radius: 10px;
  margin-bottom: 10px; border-right: 4px solid #64748b;
  page-break-inside: avoid;
}
.r-task-head { display: flex; gap: 8px; margin-bottom: 6px; }
.r-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 700; }
.r-urgent { background: #fee2e2; color: #dc2626; }
.r-important { background: #fef3c7; color: #d97706; }
.r-normal { background: #d1fae5; color: #059669; }
.r-status {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  background: #e0e7ff; color: #3730a3; font-weight: 700;
}
.r-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #1a1a1a; }
.r-meta {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: #64748b; margin-bottom: 4px;
}
.r-notes { font-size: 12px; color: #64748b; margin-top: 6px; font-style: italic; }
.r-comments { font-size: 12px; color: #2563eb; margin-top: 4px; }

.r-footer {
  margin-top: 30px; padding-top: 16px;
  border-top: 2px solid #e2e8f0;
  text-align: center; font-size: 12px; color: #94a3b8;
}

#toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-3); color: var(--text);
  padding: 14px 24px; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  border: 1px solid var(--primary);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0; transition: 0.3s; z-index: 9999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 700px) {
  #tasksList { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .header-brand h1 { font-size: 16px; }
  .header-brand .subtitle { display: none; }
  .header-logo-wrap { width: 42px; height: 42px; }
  .login-logo-wrap { width: 110px; height: 110px; }
  .login-card h1 { font-size: 26px; }
  .team-row { grid-template-columns: 1fr; gap: 6px; }
  .user-info { gap: 6px; font-size: 11px; }
  .role { padding: 3px 8px; font-size: 10px; }
  .modal-meta { grid-template-columns: 1fr; }
  .modal-actions { flex-wrap: wrap; }
  .modal-status-select { margin-left: 0; width: 100%; }
  .r-summary { grid-template-columns: 1fr 1fr; }
  .report-content { padding: 20px; }
  .r-header { flex-direction: column; text-align: center; gap: 14px; }
  .r-logo-wrap { width: 80px; height: 80px; }
  .r-header-text h1 { font-size: 24px; }
  .r-header::after { right: 50%; transform: translateX(50%); }
}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="login-logo" alt="EMAK">
    </div>
    <h1>EMAK Hub</h1>
    <p>نظام إدارة المهام — قسم نظم المعلومات</p>
    <button id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      تسجيل الدخول بجوجل
    </button>
  </div>
</div>

<!-- شاشة التحميل -->
<div id="loadingScreen">
  <div class="loading-logo-wrap">
    <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="loading-logo" alt="EMAK">
  </div>
  <div class="loading-text">جارٍ التحميل...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- الشاشة الرئيسية -->
<div id="mainScreen">
  <header>
    <div class="header-brand">
      <div class="header-logo-wrap">
        <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="header-logo" alt="EMAK">
      </div>
      <div>
        <h1>EMAK Hub</h1>
        <div class="subtitle">نظم معلومات إيماك</div>
      </div>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button class="btn-report" onclick="window.openReport()">📄 تقرير PDF</button>
      <button id="themeBtn" class="icon-btn" title="تبديل الوضع">☀️</button>
      <button id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="container">

    <div class="card-panel">
      <div class="panel-title">📊 نظرة عامة</div>
      <div class="stats-grid">
        <div class="stat total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">إجمالي المهام</div></div>
        <div class="stat done"><div class="stat-num" id="statDone">0</div><div class="stat-label">مكتملة</div></div>
        <div class="stat progress"><div class="stat-num" id="statProgress">0</div><div class="stat-label">جارية</div></div>
        <div class="stat overdue"><div class="stat-num" id="statOverdue">0</div><div class="stat-label">متأخرة</div></div>
      </div>
    </div>

    <div class="card-panel">
      <div class="panel-title">📈 تحليل الإنتاجية</div>
      <div class="charts-grid">
        <div class="chart-box"><canvas id="chartStatus"></canvas></div>
        <div class="chart-box"><canvas id="chartProductivity"></canvas></div>
      </div>
    </div>

    <div class="card-panel">
      <div class="panel-title">👥 أداء الفريق</div>
      <div id="teamList"></div>
    </div>

    <div class="card-panel" id="addTaskCard">
      <div class="panel-title">➕ إضافة مهمة جديدة</div>
      <form id="addTaskForm" class="form-grid">
        <input id="taskTitle" type="text" placeholder="عنوان المهمة *" required>
        <select id="taskAssignee" required>
          <option value="">-- المسؤول --</option>
          <option value="بهاء">بهاء محمد</option>
          <option value="محمود">محمود عادل</option>
        </select>
        <select id="taskPriority" required>
          <option value="عادي">🟢 عادي</option>
          <option value="مهم">🟡 مهم</option>
          <option value="عاجل">🔴 عاجل</option>
        </select>
        <input id="taskDue" type="date" title="تاريخ التسليم">
        <input id="taskNotes" type="text" placeholder="ملاحظات (اختياري)">
        <input id="taskTags" type="text" placeholder="وسوم (فاصلة: شبكات, صيانة)">
        <button type="submit">إضافة المهمة</button>
      </form>
    </div>

    <div class="controls-bar">
      <div class="search-wrap">
        <input id="searchBox" type="text" placeholder="ابحث في المهام...">
      </div>
      <select id="sortSelect">
        <option value="priority">ترتيب: الأولوية</option>
        <option value="date">ترتيب: الأحدث</option>
        <option value="due">ترتيب: تاريخ التسليم</option>
        <option value="title">ترتيب: أبجدي</option>
      </select>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="بهاء">بهاء</button>
      <button class="filter-btn" data-filter="محمود">محمود</button>
      <button class="filter-btn" data-filter="pending">معلقة</button>
      <button class="filter-btn" data-filter="overdue">متأخرة</button>
      <button class="filter-btn" data-filter="done">مكتملة</button>
      <button class="filter-btn" data-filter="week">هذا الأسبوع</button>
      <button class="filter-btn" data-filter="month">هذا الشهر</button>
    </div>

    <div id="tasksList"></div>
  </div>
</div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div id="modalBody"></div>
  </div>
</div>

<div id="reportOverlay">
  <div class="report-wrapper">
    <div class="report-toolbar">
      <div class="report-toolbar-title">📄 معاينة التقرير</div>
      <div class="report-toolbar-actions">
        <button class="btn-download" id="downloadPdfBtn" onclick="window.downloadPDF()">📄 تحميل PDF</button>
        <button class="btn-close-report" onclick="window.closeReport()">إغلاق</button>
      </div>
    </div>
    <div class="report-scroll">
      <div id="reportBody"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
