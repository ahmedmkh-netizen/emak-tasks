<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMAK Hub - إدارة المهام</title>
<link rel="icon" href="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue, update, remove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBagaYYgtQgAGyntE1go9IsGy7T85cvuSY",
  authDomain: "emak-tasks.firebaseapp.com",
  databaseURL: "https://emak-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emak-tasks",
  storageBucket: "emak-tasks.firebasestorage.app",
  messagingSenderId: "752119205815",
  appId: "1:752119205815:web:a96725f43555fb0c742232"
};

// ==== الإعدادات ====
const ADMIN_EMAILS = ["ahmedmkh@gmail.com"];
const LOGO_URL = "https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

// ==== الحالة ====
let currentUser = null;
let isAdmin = false;
let allTasks = {};
let currentFilter = "all";
let currentTheme = localStorage.getItem("theme") || "dark";

// ==== تطبيق الثيم ====
function applyTheme() {
  document.documentElement.setAttribute("data-theme", currentTheme);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = currentTheme === "dark" ? "☀️" : "🌙";
  localStorage.setItem("theme", currentTheme);
}

// ==== أدوات مساعدة ====
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" });
}

function daysRemaining(dueDate) {
  if (!dueDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueDate); due.setHours(0,0,0,0);
  return Math.round((due - today) / (1000 * 60 * 60 * 24));
}

function dueLabel(dueDate) {
  const d = daysRemaining(dueDate);
  if (d === null) return "";
  if (d < 0) return `⚠️ متأخر ${Math.abs(d)} يوم`;
  if (d === 0) return `🔥 يستحق اليوم`;
  if (d === 1) return `📅 يستحق غداً`;
  if (d <= 3) return `📅 باقي ${d} أيام`;
  return `📅 ${dueDate}`;
}

// ==== تسجيل الدخول ====
document.getElementById("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) { alert("فشل تسجيل الدخول: " + e.message); }
};

document.getElementById("logoutBtn").onclick = () => {
  if (confirm("متأكد إنك عايز تخرج؟")) signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  const loginScreen = document.getElementById("loginScreen");
  const mainScreen = document.getElementById("mainScreen");
  if (user) {
    currentUser = user;
    isAdmin = ADMIN_EMAILS.includes(user.email);
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    document.getElementById("userName").textContent = user.displayName || user.email;
    document.getElementById("userRole").textContent = isAdmin ? "👑 مدير" : "👤 موظف";
    document.getElementById("userRole").className = isAdmin ? "role admin" : "role user";
    // إظهار فورم الإضافة لو أدمن
    document.getElementById("addTaskCard").style.display = isAdmin ? "block" : "none";
    // سجل المستخدم
    set(ref(db, "users/" + user.uid), {
      name: user.displayName || "",
      email: user.email || "",
      lastLogin: serverTimestamp(),
      isAdmin: isAdmin
    });
    loadTasks();
  } else {
    currentUser = null;
    isAdmin = false;
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
  }
});

// ==== تحميل المهام ====
function loadTasks() {
  onValue(ref(db, "tasks"), (snap) => {
    allTasks = snap.val() || {};
    renderAll();
  });
}

// ==== إضافة مهمة (Admin فقط) ====
document.getElementById("addTaskForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!isAdmin) return alert("غير مصرح");
  const title = document.getElementById("taskTitle").value.trim();
  const assignee = document.getElementById("taskAssignee").value;
  const priority = document.getElementById("taskPriority").value;
  const dueDate = document.getElementById("taskDue").value;
  const notes = document.getElementById("taskNotes").value.trim();
  if (!title || !assignee) return;

  await push(ref(db, "tasks"), {
    title, assignee, priority, dueDate, notes,
    status: "جديدة",
    createdBy: currentUser.email,
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });

  e.target.reset();
  showToast("✅ تمت إضافة المهمة");
};

// ==== تغيير الحالة (الكل) ====
async function changeStatus(taskId, newStatus) {
  const t = allTasks[taskId];
  if (!t) return;
  await update(ref(db, "tasks/" + taskId), {
    status: newStatus,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast(`🔄 تم تحديث الحالة إلى "${newStatus}"`);
}

// ==== إضافة ملاحظة (الكل) ====
async function addComment(taskId) {
  const input = document.getElementById("comment-" + taskId);
  const text = input.value.trim();
  if (!text) return;

  const commentRef = push(ref(db, "tasks/" + taskId + "/comments"));
  await set(commentRef, {
    text,
    author: currentUser.displayName || currentUser.email.split("@")[0],
    authorEmail: currentUser.email,
    createdAt: serverTimestamp()
  });

  // تحديث updatedAt
  await update(ref(db, "tasks/" + taskId), {
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });

  input.value = "";
  showToast("💬 تمت إضافة الملاحظة");
}

// ==== حذف مهمة (Admin فقط) ====
async function deleteTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  if (confirm("متأكد من حذف المهمة دي؟ لا يمكن التراجع!")) {
    await remove(ref(db, "tasks/" + taskId));
    showToast("🗑️ تم حذف المهمة");
  }
}

// ==== تعديل مهمة (Admin فقط) ====
async function editTask(taskId) {
  if (!isAdmin) return alert("غير مصرح");
  const t = allTasks[taskId];
  if (!t) return;
  const newTitle = prompt("العنوان الجديد:", t.title);
  if (newTitle === null) return;
  const newDue = prompt("تاريخ التسليم الجديد (YYYY-MM-DD):", t.dueDate || "");
  if (newDue === null) return;
  const newPriority = prompt("الأولوية (عاجل / مهم / عادي):", t.priority || "عادي");
  if (newPriority === null) return;

  await update(ref(db, "tasks/" + taskId), {
    title: newTitle.trim() || t.title,
    dueDate: newDue.trim(),
    priority: newPriority.trim() || "عادي",
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email,
    updatedByName: currentUser.displayName || currentUser.email.split("@")[0]
  });
  showToast("✏️ تم تعديل المهمة");
}

// ==== فلترة ====
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderAll();
  };
});

document.getElementById("themeBtn").onclick = () => {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  applyTheme();
};

// ==== Toast ====
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ==== عرض كل حاجة ====
function renderAll() {
  renderStats();
  renderTeam();
  renderTasks();
}

// ==== إحصائيات ====
function renderStats() {
  const entries = Object.entries(allTasks);
  const total = entries.length;
  const done = entries.filter(([_, t]) => t.status === "مكتملة").length;
  const progress = entries.filter(([_, t]) => t.status === "جاري التنفيذ").length;
  const overdue = entries.filter(([_, t]) => {
    const d = daysRemaining(t.dueDate);
    return d !== null && d < 0 && t.status !== "مكتملة";
  }).length;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statDone").textContent = done;
  document.getElementById("statProgress").textContent = progress;
  document.getElementById("statOverdue").textContent = overdue;
}

// ==== أداء الفريق ====
function renderTeam() {
  const team = {};
  Object.values(allTasks).forEach(t => {
    if (!team[t.assignee]) team[t.assignee] = { total: 0, done: 0 };
    team[t.assignee].total++;
    if (t.status === "مكتملة") team[t.assignee].done++;
  });

  const html = Object.entries(team).map(([name, s]) => {
    const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
    return `
      <div class="team-row">
        <div class="team-name">${escapeHtml(name)}</div>
        <div class="team-bar"><div class="team-fill" style="width:${pct}%"></div></div>
        <div class="team-pct">${pct}% (${s.done}/${s.total})</div>
      </div>`;
  }).join("");

  document.getElementById("teamList").innerHTML = html || '<p class="empty">لا توجد بيانات</p>';
}

// ==== المهام ====
function renderTasks() {
  const list = document.getElementById("tasksList");
  const entries = Object.entries(allTasks).sort((a, b) => {
    // الأولوية: عاجل أولاً
    const pri = { "عاجل": 0, "مهم": 1, "عادي": 2 };
    const pa = pri[a[1].priority] ?? 2;
    const pb = pri[b[1].priority] ?? 2;
    if (pa !== pb) return pa - pb;
    // بعدين حسب التاريخ
    return (b[1].createdAt || 0) - (a[1].createdAt || 0);
  });

  const filtered = entries.filter(([_, t]) => {
    if (currentFilter === "all") return true;
    if (currentFilter === "بهاء") return t.assignee === "بهاء";
    if (currentFilter === "محمود") return t.assignee === "محمود";
    if (currentFilter === "pending") return t.status !== "مكتملة";
    if (currentFilter === "done") return t.status === "مكتملة";
    if (currentFilter === "overdue") {
      const d = daysRemaining(t.dueDate);
      return d !== null && d < 0 && t.status !== "مكتملة";
    }
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<p class="empty">لا توجد مهام مطابقة</p>';
    return;
  }

  list.innerHTML = filtered.map(([id, t]) => {
    const statusClass = t.status === "مكتملة" ? "done"
      : t.status === "جاري التنفيذ" ? "progress" : "new";
    const priorityClass = t.priority === "عاجل" ? "urgent"
      : t.priority === "مهم" ? "important" : "normal";
    const isUrgent = t.priority === "عاجل" && t.status !== "مكتملة";
    const d = daysRemaining(t.dueDate);
    const isOverdue = d !== null && d < 0 && t.status !== "مكتملة";

    // آخر تعديل
    const updater = t.updatedByName
      ? `<div class="updated-by">✏️ آخر تعديل: ${escapeHtml(t.updatedByName)} — ${formatDate(t.updatedAt)}</div>`
      : "";

    // الملاحظات
    const comments = t.comments ? Object.entries(t.comments).sort((a,b) =>
      (a[1].createdAt || 0) - (b[1].createdAt || 0)
    ) : [];

    const commentsHtml = comments.length > 0 ? `
      <div class="comments">
        <div class="comments-title">💬 الملاحظات (${comments.length})</div>
        ${comments.map(([cid, c]) => `
          <div class="comment">
            <div class="comment-head">
              <strong>${escapeHtml(c.author)}</strong>
              <span class="comment-date">${formatDate(c.createdAt)}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `).join("")}
      </div>
    ` : "";

    return `
      <div class="task ${priorityClass} ${statusClass} ${isUrgent ? "urgent-glow" : ""}">
        <div class="task-header">
          <div class="task-badges">
            <span class="priority-badge ${priorityClass}">${
              t.priority === "عاجل" ? "🔴 عاجل" :
              t.priority === "مهم" ? "🟡 مهم" : "🟢 عادي"
            }</span>
            <span class="status-badge ${statusClass}">${t.status}</span>
          </div>
          <span class="assignee">👤 ${escapeHtml(t.assignee)}</span>
        </div>
        <h3 class="task-title">${escapeHtml(t.title)}</h3>
        ${t.notes ? `<p class="notes">${escapeHtml(t.notes)}</p>` : ""}
        ${t.dueDate ? `<div class="due ${isOverdue ? "overdue" : ""}">${dueLabel(t.dueDate)}</div>` : ""}
        ${updater}

        ${commentsHtml}

        <div class="comment-form">
          <input id="comment-${id}" type="text" placeholder="أضف ملاحظة...">
          <button onclick="window.addComment('${id}')">إرسال</button>
        </div>

        <div class="task-footer">
          <select onchange="window.changeStatus('${id}', this.value)">
            <option ${t.status === "جديدة" ? "selected" : ""}>جديدة</option>
            <option ${t.status === "جاري التنفيذ" ? "selected" : ""}>جاري التنفيذ</option>
            <option ${t.status === "مكتملة" ? "selected" : ""}>مكتملة</option>
          </select>
          ${isAdmin ? `
            <div class="admin-actions">
              <button onclick="window.editTask('${id}')" title="تعديل">✏️</button>
              <button class="del" onclick="window.deleteTask('${id}')" title="حذف">🗑️</button>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }).join("");
}

window.changeStatus = changeStatus;
window.addComment = addComment;
window.deleteTask = deleteTask;
window.editTask = editTask;

// ==== تشغيل الثيم ====
applyTheme();
</script>

<style>
:root[data-theme="dark"] {
  --bg: #0f172a;
  --bg-2: #1e293b;
  --bg-3: #334155;
  --text: #f1f5f9;
  --text-2: #94a3b8;
  --border: #334155;
  --primary: #3b82f6;
  --primary-2: #1e40af;
  --accent: #f59e0b;
  --urgent: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
}
:root[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-2: #ffffff;
  --bg-3: #e2e8f0;
  --text: #0f172a;
  --text-2: #64748b;
  --border: #cbd5e1;
  --primary: #2563eb;
  --primary-2: #1e40af;
  --accent: #d97706;
  --urgent: #dc2626;
  --success: #059669;
  --warning: #d97706;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ==== شاشة تسجيل الدخول ==== */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  background: radial-gradient(circle at top, #1e3a8a, #0f172a 70%);
}
.login-card {
  background: rgba(30, 41, 59, 0.9);
  backdrop-filter: blur(20px);
  border: 1px solid #334155;
  padding: 50px 40px; border-radius: 20px;
  text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-logo { width: 90px; margin-bottom: 20px; }
.login-card h1 { color: #f1f5f9; margin-bottom: 8px; font-size: 26px; }
.login-card p { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
#loginBtn {
  background: white; color: #333; border: none;
  padding: 14px 24px; border-radius: 10px; cursor: pointer;
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 12px; justify-content: center;
  width: 100%; transition: 0.2s;
}
#loginBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.2); }
#loginBtn img { width: 22px; }

/* ==== الهيدر ==== */
#mainScreen { display: none; }
header {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-brand img { width: 40px; height: 40px; object-fit: contain; }
.header-brand h1 { font-size: 20px; color: var(--text); }
.header-brand .subtitle { font-size: 11px; color: var(--text-2); }

.user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; }
.role {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
}
.role.admin { background: rgba(245,158,11,0.2); color: var(--accent); border: 1px solid var(--accent); }
.role.user { background: rgba(59,130,246,0.2); color: var(--primary); border: 1px solid var(--primary); }

.icon-btn {
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  font-size: 15px; transition: 0.2s;
}
.icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

#logoutBtn {
  background: rgba(239,68,68,0.15); color: var(--urgent);
  border: 1px solid var(--urgent);
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
#logoutBtn:hover { background: var(--urgent); color: white; }

/* ==== الحاوية ==== */
.container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

/* ==== بطاقة عامة ==== */
.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* ==== الإحصائيات ==== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.stat {
  background: var(--bg-3);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
  transition: 0.2s;
}
.stat:hover { transform: translateY(-3px); }
.stat-num { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: var(--text-2); }
.stat.total .stat-num { color: var(--primary); }
.stat.done .stat-num { color: var(--success); }
.stat.progress .stat-num { color: var(--warning); }
.stat.overdue .stat-num { color: var(--urgent); }

/* ==== أداء الفريق ==== */
.team-row {
  display: grid;
  grid-template-columns: 120px 1fr 120px;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.team-row:last-child { border-bottom: none; }
.team-name { font-weight: 600; font-size: 14px; }
.team-bar {
  height: 10px; background: var(--bg-3); border-radius: 5px; overflow: hidden;
}
.team-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--success));
  transition: width 0.5s;
}
.team-pct { font-size: 13px; color: var(--text-2); text-align: left; }

/* ==== فورم الإضافة ==== */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 12px;
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px; font-family: inherit;
}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-grid button {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: white; border: none;
  padding: 14px; border-radius: 10px; cursor: pointer;
  font-size: 15px; font-weight: 700;
  transition: 0.2s;
}
.form-grid button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); }

/* ==== الفلاتر ==== */
.filters {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  align-items: center;
}
.filter-btn {
  background: var(--bg-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 20px; cursor: pointer;
  font-size: 13px; transition: 0.2s;
}
.filter-btn:hover { border-color: var(--primary); }
.filter-btn.active {
  background: var(--primary); color: white; border-color: var(--primary);
}

/* ==== المهمة ==== */
.task {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
  border-right: 5px solid var(--primary);
  transition: 0.3s;
  position: relative;
}
.task.normal { border-right-color: var(--success); }
.task.important { border-right-color: var(--warning); }
.task.urgent { border-right-color: var(--urgent); }
.task.done { opacity: 0.6; }

/* ✨ الفلاشر للمهام العاجلة ✨ */
@keyframes urgentGlow {
  0%, 100% {
    box-shadow: 0 0 5px rgba(239,68,68,0.3),
                0 0 15px rgba(239,68,68,0.2),
                inset 0 0 5px rgba(239,68,68,0.1);
    border-color: var(--border);
  }
  50% {
    box-shadow: 0 0 20px rgba(239,68,68,0.8),
                0 0 40px rgba(239,68,68,0.5),
                inset 0 0 15px rgba(239,68,68,0.2);
    border-color: var(--urgent);
  }
}
.task.urgent-glow {
  animation: urgentGlow 1.5s ease-in-out infinite;
}

.task-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
}
.task-badges { display: flex; gap: 8px; }
.priority-badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}
.priority-badge.urgent { background: rgba(239,68,68,0.15); color: var(--urgent); border: 1px solid var(--urgent); }
.priority-badge.important { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid var(--warning); }
.priority-badge.normal { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); }

.status-badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700;
}
.status-badge.new { background: rgba(59,130,246,0.15); color: var(--primary); border: 1px solid var(--primary); }
.status-badge.progress { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid var(--warning); }
.status-badge.done { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); }

.assignee { font-size: 13px; color: var(--text-2); }
.task-title { font-size: 17px; margin-bottom: 8px; color: var(--text); }
.notes { font-size: 13px; color: var(--text-2); margin-bottom: 10px; line-height: 1.6; }

.due {
  font-size: 13px; padding: 6px 12px;
  background: var(--bg-3); border-radius: 8px;
  display: inline-block; margin-bottom: 10px;
  color: var(--text-2);
}
.due.overdue { background: rgba(239,68,68,0.15); color: var(--urgent); font-weight: 700; }

.updated-by {
  font-size: 11px; color: var(--text-2);
  padding: 6px 10px; margin-bottom: 10px;
  background: var(--bg-3); border-radius: 6px;
  display: inline-block;
}

/* ==== الملاحظات ==== */
.comments {
  background: var(--bg-3);
  border-radius: 10px;
  padding: 12px;
  margin: 12px 0;
}
.comments-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: var(--primary); }
.comment {
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
}
.comment:last-child { border-bottom: none; }
.comment-head { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
.comment-head strong { color: var(--text); }
.comment-date { color: var(--text-2); }
.comment-text { font-size: 13px; color: var(--text); }

/* ==== فورم الملاحظات ==== */
.comment-form {
  display: flex; gap: 8px; margin: 12px 0;
}
.comment-form input {
  flex: 1; padding: 10px 14px;
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit;
}
.comment-form input:focus { outline: none; border-color: var(--primary); }
.comment-form button {
  padding: 10px 20px;
  background: var(--primary); color: white;
  border: none; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
.comment-form button:hover { background: var(--primary-2); }

/* ==== الفوتر ==== */
.task-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
  gap: 10px; flex-wrap: wrap;
}
.task-footer select {
  padding: 8px 14px;
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.admin-actions { display: flex; gap: 6px; }
.admin-actions button {
  background: var(--bg-3); border: 1px solid var(--border);
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  font-size: 14px; transition: 0.2s;
}
.admin-actions button:hover { background: var(--primary); border-color: var(--primary); }
.admin-actions button.del:hover { background: var(--urgent); border-color: var(--urgent); }

.empty { text-align: center; padding: 40px; color: var(--text-2); }

/* ==== Toast ==== */
#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--bg-3); color: var(--text);
  padding: 14px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--primary);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0; transition: 0.3s; z-index: 9999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ==== Responsive ==== */
@media (max-width: 700px) {
  .form-grid { grid-template-columns: 1fr; }
  .header-brand h1 { font-size: 16px; }
  .header-brand .subtitle { display: none; }
  .team-row { grid-template-columns: 1fr; gap: 6px; }
  .user-info { gap: 8px; font-size: 12px; }
  .role { padding: 3px 8px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen">
  <div class="login-card">
    <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" class="login-logo" alt="EMAK">
    <h1>EMAK Hub</h1>
    <p>نظام إدارة المهام — قسم نظم المعلومات</p>
    <button id="loginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      تسجيل الدخول بجوجل
    </button>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="mainScreen">
  <header>
    <div class="header-brand">
      <img src="https://i.postimg.cc/9MnXvxMn/EMAK-Logo.png" alt="EMAK">
      <div>
        <h1>EMAK Hub</h1>
        <div class="subtitle">نظم معلومات إيماك</div>
      </div>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button id="themeBtn" class="icon-btn" title="تبديل الوضع">☀️</button>
      <button id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="container">

    <!-- الإحصائيات -->
    <div class="card">
      <h2 style="margin-bottom:14px;font-size:16px;">📊 نظرة عامة</h2>
      <div class="stats-grid">
        <div class="stat total">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">إجمالي المهام</div>
        </div>
        <div class="stat done">
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-label">مكتملة</div>
        </div>
        <div class="stat progress">
          <div class="stat-num" id="statProgress">0</div>
          <div class="stat-label">جارية</div>
        </div>
        <div class="stat overdue">
          <div class="stat-num" id="statOverdue">0</div>
          <div class="stat-label">متأخرة</div>
        </div>
      </div>
    </div>

    <!-- أداء الفريق -->
    <div class="card">
      <h2 style="margin-bottom:14px;font-size:16px;">👥 أداء الفريق</h2>
      <div id="teamList"></div>
    </div>

    <!-- إضافة مهمة (للأدمن فقط) -->
    <div class="card" id="addTaskCard">
      <h2 style="margin-bottom:14px;font-size:16px;">➕ إضافة مهمة جديدة</h2>
      <form id="addTaskForm" class="form-grid">
        <input id="taskTitle" type="text" placeholder="عنوان المهمة *" required>
        <select id="taskAssignee" required>
          <option value="">-- المسؤول --</option>
          <option value="بهاء">بهاء محمد</option>
          <option value="محمود">محمود عادل</option>
        </select>
        <select id="taskPriority" required>
          <option value="عادي">🟢 عادي</option>
          <option value="مهم">🟡 مهم</option>
          <option value="عاجل">🔴 عاجل</option>
        </select>
        <input id="taskDue" type="date" title="تاريخ التسليم">
        <input id="taskNotes" type="text" placeholder="ملاحظات (اختياري)">
        <button type="submit">إضافة المهمة</button>
      </form>
    </div>

    <!-- الفلاتر -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="بهاء">بهاء</button>
      <button class="filter-btn" data-filter="محمود">محمود</button>
      <button class="filter-btn" data-filter="pending">معلقة</button>
      <button class="filter-btn" data-filter="overdue">متأخرة</button>
      <button class="filter-btn" data-filter="done">مكتملة</button>
    </div>

    <div id="tasksList"></div>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
